    <style>
/* UI styles */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background-color: #0b111e;
    color: #e2e8f0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 24px 32px;
    min-height: 100vh;
}

/* UI styles */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto 24px auto;
}

.top-bar h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #ffffff;
}

.top-bar h1 span {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 3px;
    color: #94a3b8;
    margin-left: 8px;
}

.subtitle {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #64748b;
    margin-top: 4px;
    text-transform: uppercase;
}

.shift-badge {
    background: #131c2e;
    border: 1px solid #26334d;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: #cbd5e1;
}

/* UI styles */
.container {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
    align-items: start;
}

/* UI styles */
.sidebar, .main-screen, .status-panel {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
}

h3 {
    font-size: 12px;
    letter-spacing: 1.2px;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 14px;
}

/* UI styles */
.nav-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: #182234;
    color: #cbd5e1;
    border: 1px solid #26334d;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
}

.nav-btn:hover {
    background: #1f2c42;
    border-color: #3b4d6b;
}

/* UI styles */
.nav-btn.active {
    background: linear-gradient(90deg, rgba(234, 88, 12, 0.22) 0%, rgba(24, 34, 52, 0.9) 100%);
    border-color: #ea580c;
    color: #ffffff;
    font-weight: 600;
}

.nav-btn.active::after {
    content: '';
    width: 7px;
    height: 7px;
    background: #fb7185;
    border-radius: 50%;
    margin-left: auto;
    box-shadow: 0 0 8px #fb7185;
}

/* UI styles */
.module-banner {
    background: radial-gradient(circle at 75% 35%, rgba(234, 88, 12, 0.45) 0%, rgba(30, 41, 59, 0.95) 60%, #162032 100%);
    border: 1px solid #2d3b55;
    border-radius: 12px;
    padding: 90px 24px 24px 24px;
    margin-bottom: 18px;
}

.module-banner h2 {
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 6px;
}

.module-banner p {
    font-size: 13px;
    color: #cbd5e1;
}

.description {
    font-size: 14px;
    line-height: 1.6;
    color: #94a3b8;
    margin-bottom: 24px;
}

h4 {
    font-size: 12px;
    letter-spacing: 1px;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 12px;
}

/* UI styles */
.action-btn {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #334155;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
}

.action-btn:hover {
    background: #283548;
    border-color: #f97316;
    transform: translateY(-1px);
}

/* UI styles */
.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 6px;
}

.stat-row span:last-child {
    font-weight: 700;
    color: #ffffff;
}

/* UI styles */
.progress-container {
    background: #1e293b;
    border-radius: 6px;
    height: 7px;
    width: 100%;
    margin-bottom: 14px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: #34d399;
    border-radius: 6px;
    width: 100%;
    transition: width 0.35s ease, background-color 0.35s ease;
}

.progress-bar.warning {
    background: #fbbf24;
}

.progress-bar.danger {
    background: #f87171;
}

/* UI styles */
.status-panel h3:not(:first-child) {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid #1e293b;
}

/* Event Log */
.event-log {
    max-height: 150px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.log-item {
    background: #182234;
    border-left: 3px solid #f97316;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12px;
    color: #cbd5e1;
    line-height: 1.4;
}

#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 99999;
}

#modal {
    position: relative;
    width: 100%;
    max-width: 650px;
    max-height: 85vh;
    overflow-y: auto;
    margin: auto;
    padding: 25px;
    background: #111827;
    border: 1px solid #334155;
    border-radius: 14px;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
}

<script>

(function(root){
 'use strict';
 const rules={
  miningError:{label:'Drill damage / failed mining',value:-5,sign:-1},
  repairError:{label:'Failed repair circuit test',value:-6,sign:-1},
  pressureError:{label:'Failed system stabilization',value:-4,sign:-1},
  flightError:{label:'Arcade flight error',value:-3,sign:-1},
  repair:{label:'First system restoration',value:10,sign:1},
  signal:{label:'First SOS transmission',value:30,sign:1},
  mining:{label:'Successful resource extraction',value:3,sign:1},
  harvest:{label:'Error-free harvest',value:5,sign:1},
  harvestFixed:{label:'Harvest after correction',value:2,sign:1},
  farmError:{label:'Plant care error',value:-5,sign:-1},
  procedure:{label:'Error-free procedure',value:5,sign:1},
  procedureFixed:{label:'Procedure after correction',value:2,sign:1},
  orderError:{label:'Procedure performed out of order',value:-4,sign:-1},
  missionCorrect:{label:'Correct decision on the first attempt',value:10,sign:1},
  missionFixed:{label:'Correct decision after an error',value:3,sign:1},
  missionWrong:{label:'Incorrect expedition decision',value:-5,sign:-1},
  missionComplete:{label:'First expedition completion',value:20,sign:1},
  emergencyCorrect:{label:'Correct emergency response on the first attempt',value:15,sign:1},
  emergencyFixed:{label:'Emergency resolved after previous attempts',value:5,sign:1},
  emergencyPartial:{label:'Partially effective emergency action',value:3,sign:1},
  emergencyWeak:{label:'Ineffective emergency action',value:-5,sign:-1},
  emergencyWrong:{label:'Incorrect emergency action',value:-10,sign:-1},
  emergencyTimeout:{label:'Emergency time expired',value:-15,sign:-1}
 };
 const defaults={version:1,profile:'Training',seed:2026,timed:false,repeatLimit:3,weights:Object.fromEntries(Object.entries(rules).map(([id,r])=>[id,r.value]))};
 const clone=x=>JSON.parse(JSON.stringify(x));
 function validate(c){
  if(!c||c.version!==1||typeof c.timed!=='boolean'||!Number.isInteger(c.seed)||c.seed<1||c.seed>2147483647||!Number.isInteger(c.repeatLimit)||c.repeatLimit<1||c.repeatLimit>10)throw Error('Check the seed (1–2147483647) and repeat limit (1–10).');
  for(const[id,r]of Object.entries(rules)){const v=c.weights?.[id];if(!Number.isInteger(v)||Math.abs(v)>100||v*r.sign<=0)throw Error('Bonuses must be whole numbers from +1 to +100; penalties from −1 to −100.');}
  for(const[a,b]of [['harvest','harvestFixed'],['procedure','procedureFixed'],['missionCorrect','missionFixed'],['emergencyCorrect','emergencyFixed']])if(c.weights[b]>c.weights[a])throw Error('The bonus for a corrected attempt cannot exceed the first-attempt bonus.');
  if(c.weights.emergencyFixed+c.weights.emergencyPartial>c.weights.emergencyCorrect)throw Error('A partial action plus a correction cannot earn more than a correct decision on the first attempt.');
  // Translate legacy Ukrainian profile labels saved by older editions of ARES-7.
  // This changes display text only; timer, seed, limits and scoring values stay intact.
  const savedProfile=String(c.profile||'Custom').trim();
  const legacyProfiles={
    '\u041d\u0430\u0432\u0447\u0430\u043b\u044c\u043d\u0438\u0439':'Training',
    '\u041d\u0430\u0432\u0447\u0430\u043b\u044c\u043d\u0438\u0439 \u043f\u0440\u043e\u0444\u0456\u043b\u044c':'Training',
    '\u0406\u0437 \u0442\u0430\u0439\u043c\u0435\u0440\u043e\u043c':'Timed',
    '\u041f\u0440\u043e\u0444\u0456\u043b\u044c \u0456\u0437 \u0442\u0430\u0439\u043c\u0435\u0440\u043e\u043c':'Timed',
    '\u0412\u043b\u0430\u0441\u043d\u0438\u0439':'Custom'
  };
  const profile=legacyProfiles[savedProfile] ||
    (/[\u0400-\u052F]/.test(savedProfile)?'Custom':savedProfile);
  return {...clone(c),profile:profile.slice(0,40)};
 }
 function createSession(config=defaults){
  const cfg=validate(config),ledger=[],seen=new Set(),counts=new Map();let total=0,counter=0,rng=cfg.seed>>>0;
  return {config:cfg,ledger,get total(){return total;},id(prefix='task'){return prefix+':'+(++counter);},
   random(){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;return (rng>>>0)/4294967296;},
   record(rule,info={}){
    if(!rules[rule])throw Error('Unknown score rule: '+rule);
    if(!info.key)throw Error('Every scoring event requires a unique key');
    if(seen.has(info.key))return {delta:0,total,duplicate:true,reason:'This action has already been scored.'};
    seen.add(info.key);let delta=cfg.weights[rule],limited=false;
    if(delta>0&&info.group){const count=counts.get(info.group)||0;const limit=info.limit??cfg.repeatLimit;if(count>=limit){delta=0;limited=true;}else counts.set(info.group,count+1);}
    const before=total;total+=delta;
    const entry={n:ledger.length+1,day:info.day??1,rule,key:info.key,label:rules[rule].label,reason:info.reason||rules[rule].label,delta,before,total,limited,section:info.section||'Station'};
    ledger.push(entry);return entry;
   }
  };
 }
 const api={rules,defaults,validate,createSession};
 if(typeof module!=='undefined'&&module.exports)module.exports=api;
 root.ARESScoringCore=api;
 if(typeof window==='undefined')return;
 let pending=clone(defaults);try{const raw=localStorage.getItem('ares-scoring-config-v1');if(raw){const saved=JSON.parse(raw);pending=validate({...saved,weights:{...defaults.weights,...saved.weights}});if(saved.profile!==pending.profile)localStorage.setItem('ares-scoring-config-v1',JSON.stringify(pending));}}catch{}
 let session=createSession(pending),resourceLog=[];
 const state=()=>window.ARESGame?.getState();
 const fields=['energy','oxygen','water','food','health','protection','materials','ice','regolith','morale'];
 function snapshot(){const s=state();return s?Object.fromEntries(fields.map(k=>[k,Number(s[k])||0])):{};}
 function trace(label,before){const after=snapshot(),changes={};for(const k of fields)if(after[k]!==before[k])changes[k]={before:before[k],after:after[k],delta:Math.round((after[k]-before[k])*100)/100};if(Object.keys(changes).length)resourceLog.push({day:state()?.day||1,label,changes});}
 root.ARESScore={
  get config(){return session.config;},get pending(){return clone(pending);},get ledger(){return session.ledger;},get resourceLog(){return resourceLog;},get total(){return session.total;},
  value(id){return session.config.weights[id];},id(p){return session.id(p);},random(){return session.random();},snapshot,trace,
  reset(){session=createSession(pending);resourceLog=[];if(state())state().score=0;window.dispatchEvent(new Event('ares:score'));},
  setConfig(config){if(state()?.gameStarted)throw Error('Scoring rules are locked until the mission ends. Start a new game to change them.');pending=validate(config);try{localStorage.setItem('ares-scoring-config-v1',JSON.stringify(pending));}catch{}session=createSession(pending);if(state())state().score=0;resourceLog=[];window.dispatchEvent(new Event('ares:score'));},
  award(rule,info){const s=state();if(!s||!s.gameStarted||s.gameOver)return {delta:0,total:session.total,reason:'No active mission.'};const e=session.record(rule,{...info,day:s.day});s.score=session.total;if(!e.duplicate){window.ARESGame.logEvent(`${e.delta>0?'+':''}${e.delta} points: ${e.reason}${e.limited?' The reward limit for this action has been reached.':''} Score: ${e.total}.`);window.dispatchEvent(new CustomEvent('ares:score',{detail:e}));}return e;},
  effect(label,fn){const before=snapshot();fn();trace(label,before);},
  effects(label,effects){this.effect(label,()=>{const s=state();for(const[k,v]of Object.entries(effects)){if(!fields.includes(k))throw Error('Unknown resource');s[k]=Math.max(0,Math.min(['materials','ice','regolith'].includes(k)?999:100,s[k]+v));}});},
  report(){return {title:'ARES-7 — Training Mission Report',model:'A fictional educational model; not NASA telemetry',config:clone(session.config),day:state()?.day,score:session.total,ledger:clone(session.ledger),resources:clone(resourceLog)};}
 };
})(typeof window==='undefined'?globalThis:window);

</script>
<script>

    const a = [];

            s.farm = true;
            ARESScore.award("repair", {key:"repair:farm",reason:"Greenhouse restored"});
            s.food = clamp(s.food + 8);
        }),
        help: 'Unlocks the growing minigame'

        label: '🥔 Grow Potatoes (Minigame)',
        cost: { water: 3, energy: 2 },

                stages: ['🌱', '🌿', '🪴', '🥔', '🥔'],

function openLifeMiniGame(s, config) {
    if (!s.gameStarted || s.gameOver) return;
    const key=ARESScore.id('life'), wrong=new Set(), wasLife=s.life;
    let done=0,finished=false,feedback='Read the sequence before acting.';
    const overlay=document.getElementById('overlay'), modal=document.getElementById('modal');
    if(!overlay||!modal)return;
    const ordered=!['Psychological Recovery','Ventilation Maintenance','Switch to Economy Mode'].includes(config.title);
    const completed=new Set();
    function draw(){
      modal.innerHTML=`<div class="sub">LIFE SUPPORT · TRAINING PROCEDURE</div><h1>${config.icon} ${config.title}</h1><p>${config.desc}</p>
      <p>${ordered?'Sequence: '+config.steps.map(t=>t.label).join(' → '):'These preparatory actions can be performed in any order.'}</p>
      <p class="learn-muted">Simplified model, not an equipment operating procedure. Skipping a check is an error.</p>
      <div class="mini-options">${config.steps.map((st,i)=>`<button id="life_step_${st.id}" ${completed.has(i)?'disabled':''}>${st.icon} ${st.label}<small>${completed.has(i)?'✓ Completed':st.sub}</small></button>`).join('')}
      <button id="life-bypass" ${wrong.has('bypass')?'disabled':''}>Start without completing checks</button></div>
      <p role="status">${feedback}</p><button id="btnLifeFinish" ${done<config.steps.length?'disabled':''}>${config.btnFinish}</button>`;
      function error(id,reason){if(wrong.has(id)){feedback='This error has already been counted. '+reason;draw();return;}
        wrong.add(id);const e=ARESScore.award('orderError',{key:key+':wrong:'+id,reason:config.title+': '+reason,section:'Life Support'});
        ARESScore.effects('Repeat Preparation After Mistake',{energy:-2});feedback=`${e.delta} points; −2 energy. ${reason}`;draw();}
      config.steps.forEach((st,i)=>document.getElementById('life_step_'+st.id).onclick=()=>{
        if(finished||s.gameOver||completed.has(i))return;
        if(ordered&&i!==done){error(st.id,'First: '+config.steps[done].label+'. The next operation requires the previous one to be completed.');return;}
        completed.add(i);done++;feedback='Stage completed: '+st.label+'.';draw();
      });
      document.getElementById('life-bypass').onclick=()=>{if(!finished&&!s.gameOver)error('bypass','Skipped checks leave a risk of an undetected fault. Complete preparation and verification.');};
      document.getElementById('btnLifeFinish').onclick=()=>{
        if(done!==config.steps.length||finished||s.gameOver)return;finished=true;
        ARESScore.effect(config.title,config.effect);
        if(!wasLife&&s.life)ARESScore.award('repair',{key:'repair:life',reason:'Oxygen module restored',section:'Life Support'});
        else ARESScore.award(wrong.size?'procedureFixed':'procedure',{key:key+':done',group:'life:'+config.title,reason:config.title+(wrong.size?' — after correction':' — error-free'),section:'Life Support'});
        overlay.style.display='none';nextTurn();
      };
    }
    draw();overlay.style.display='flex';
}

function updateLifeTurn(s) {
    if (s.morale === undefined) s.morale = 100;
    if (s.filterDirt === undefined) s.filterDirt = 0;

    if (s.storm > 0) {
        s.filterDirt = clamp(s.filterDirt + 25);
    } else {
        s.filterDirt = clamp(s.filterDirt + 5);
    }

    let filterPenalty = s.filterDirt > 50 ? 1.5 : 1;
    let baseConsumption = ((s.life && s.energy > 1) ? 0.5 : 5) * filterPenalty;

    if (s.ecoMode) {
        baseConsumption = Math.max(0.2, baseConsumption * 0.5);
        s.morale = clamp(s.morale - 15);
        s.ecoMode = false;
    } else if (s.oxygen < 30 || s.water < 20) {
        s.morale = clamp(s.morale - 8);
    } else {
        s.morale = clamp(s.morale + 2);
    }

    s.oxygen = clamp(s.oxygen - baseConsumption);
    s.water = clamp(s.water - 3);

    if (s.oxygen < 15 && s.energy >= 15 && !s.emergencyVentUsed) {
        s.energy = clamp(s.energy - 15);
        s.oxygen = clamp(s.oxygen + 20);
        s.emergencyVentUsed = true;
        if (typeof notice === 'function') {
            notice('🚨 AUTO-VENTILATION: Critical oxygen level! Emergency release activated (+20 oxygen, -15 energy).');
        }
    }

    if (s.morale < 25) {
        s.health = clamp(s.health - 4);
        if (typeof notice === 'function') {
            notice('⚠️ Low crew morale! Fatigue and stress reduce health.');
        }
    }

    if (s.oxygen < 18 || s.water < 12 || s.food < 10 || s.energy < 2) {
        s.health = clamp(s.health - 11);
    } else if (s.life && s.health < 100 && s.morale >= 50) {
        s.health = clamp(s.health + 2);
    }
}

    document.head.appendChild(rpStyle);

    const rpMain = document.getElementById("rp-main");
    const rpStats = document.getElementById("rp-stats");

    function syncProtection() {
        if (window.ARESGame) {
            window.ARESGame.updateProtection(
                protectionState.health,
                protectionState.hull
            );

            window.ARESGame.logEvent(
                `Emergency system: health ${protectionState.health}%, hull ${protectionState.hull}%.`
            );
        }

        updateProtectionStats();
    }

    function updateProtectionStats() {
        const current=window.ARESGame?.getState();
        if(current){protectionState.health=current.health;protectionState.hull=current.protection;}
        rpStats.textContent =
            `HEALTH: ${protectionState.health}% | ` +
            `HULL: ${protectionState.hull}% | ` +
            `SHIELD: ${protectionState.shield}% | ` +
            `TOTAL SCORE: ${ARESScore.total} | ` +
            `LEVEL: ${protectionState.level}`;
        updateEmergencyNotice();
    }

    function updateEmergencyNotice() {
        const banner = document.getElementById('emergency-notice');
        if (!banner) return;
        const active = protectionState.active && protectionState.incident &&
            !protectionState.gameOver && !window.ARESGame?.getState().gameOver;
        banner.hidden = !active;
        if (!active) return;
        document.getElementById('emergency-notice-text').textContent =
            'Emergency: ' + protectionState.incident.name +
            (ARESScore.config.timed ? '. The timer runs only while the emergency compartment is open.' : '. Training mode — no timer.');
        document.getElementById('emergency-notice-open').onclick = () => {
            window.ARESMissions?.returnToMap();
            window.ARESGame.closeSpaceMap();
            window.ARESGame.selectRoom('emergency');
        };
    }

    function getCurrentGameDay() {
        if (window.ARESGame) {
            const state = window.ARESGame.getState();

            if (state && typeof state.day === "number") {
                return state.day;
            }
        }

        return 1;
    }

    function scheduleNextIncident() {
        const delay = Math.floor(ARESScore.random() * 3) + 3;

        protectionState.nextIncidentDay = getCurrentGameDay() + delay;
    }

    function renderProtectionWaiting() {
        const daysLeft = protectionState.nextIncidentDay === null
            ? 0
            : Math.max(0, protectionState.nextIncidentDay - getCurrentGameDay());

        rpMain.innerHTML = `
            <h1 class="rp-title">PROTECTION SYSTEM</h1>

            <div class="rp-panel">
                <p class="rp-empty">No active emergencies.</p>
                ${protectionState.lastResult?`<p>${protectionState.lastResult.feedback}</p><p>${protectionState.lastResult.advice}</p>`:""}
                <p>The station is operating normally.</p>
                <p>The next emergency is expected in ${daysLeft} game days.</p>
            </div>
        `;
    }

    function switchProtectionPage(page) {
        if (protectionState.gameOver || !protectionState.started) return;

        protectionState.page = page;

        document.querySelectorAll(".rp-nav").forEach(button => {
            button.classList.toggle("active", button.dataset.page === page);
        });

        renderProtectionPage();
    }

    function renderProtectionPage() {
        updateEmergencyNotice();
        if (!protectionState.started) {
            rpMain.innerHTML = `
                <h1 class="rp-title">PROTECTION SYSTEM</h1>
                <div class="rp-panel">
                    <p>The emergency module is waiting for the main mission to start.</p>
                </div>
            `;
            return;
        }

        if (protectionState.gameOver) {
            renderProtectionGameOver();
            return;
        }

        if (!protectionState.active || !protectionState.incident) {
            renderProtectionWaiting();
            return;
        }

        if (protectionState.page === "Emergencies") {
            renderProtectionIncident();
        } else {
            renderProtectionActions();
        }
    }

    function renderProtectionIncident() {
        const incident = protectionState.incident;

        if (!incident) {
            renderProtectionWaiting();
            return;
        }

        let severityColor = "#FF647C";

        if (incident.severity === "MEDIUM") severityColor = "#FFC857";
        if (incident.severity === "HIGH") severityColor = "#FF9D55";

        rpMain.innerHTML = `
            <h1 class="rp-title">EMERGENCY CENTER</h1>

            <div class="rp-subtitle">
                Monitor the station situation and read the instructions carefully.
            </div>

            <div class="rp-panel">
                <div class="rp-incident-name">${incident.name}</div>

                <div class="rp-severity" style="color:${severityColor}">
                    DANGER: ${incident.severity}
                </div>

                <div class="rp-timer" id="rp-timer">
                    ${ARESScore.config.timed?"TIME LEFT: "+protectionState.timeLeft+" sec.":"TRAINING MODE: NO TIMER"}
                </div>

                <h3>WHAT HAPPENED?</h3>
                <p>${incident.description}</p>

                <h3>CAUSE OF EMERGENCY:</h3>
                <p>${incident.cause}</p>
            </div>

            <div class="rp-panel">
                <h3>ASTRONAUT INSTRUCTIONS</h3>

                <div class="rp-instructions">
                    ${incident.instructions.map((item, i) =>
                        `${i + 1}. ${item}`
                    ).join("<br>")}
                </div>
            </div>

            <div class="rp-panel">
                <h3>LATEST SYSTEM RESPONSE</h3>
                <p id="rp-status">${protectionState.lastResult?.feedback || "Waiting for astronaut action..."}</p>
                <button class="rp-action" data-page="Protection">Choose an action to resolve the emergency →</button>
            </div>
        `;
    }

    function renderProtectionActions() {
        if (!protectionState.active) {
            renderProtectionWaiting();
            return;
        }

        rpMain.innerHTML = `
            <h1 class="rp-title">PROTECTION SYSTEM</h1>

            <div class="rp-subtitle">
                Choose an action according to the instructions.
            </div>

            <div class="rp-panel">
                <div class="rp-incident-name">${protectionState.incident.name}</div>
                <div class="rp-timer" id="rp-timer">${ARESScore.config.timed ? 'TIME LEFT: '+protectionState.timeLeft+' sec.' : 'TRAINING MODE: NO TIMER'}</div>
                <p>${protectionState.incident.description}</p>
                <p><strong>Cause:</strong> ${protectionState.incident.cause}</p>
                <h3>ASTRONAUT INSTRUCTIONS</h3>
                <ol class="rp-instructions">${protectionState.incident.instructions.map(item => `<li>${item}</li>`).join('')}</ol>
            </div>

            <div class="rp-panel">
                <h3>CHOOSE A PROTECTIVE ACTION</h3>

                <div class="rp-actions">
                    ${protectionActions.map(([name, id]) => `
                        <button class="rp-action"
                            data-action="${id}"
                            ${protectionState.usedActions.includes(id) ? "disabled" : ""}>
                            ${name}
                        </button>
                    `).join("")}
                </div>
            </div>

            <div class="rp-panel">
                <h3>RESULT OF YOUR DECISION</h3>
                <div class="rp-result-percent" id="rp-percent">— / 100</div>
                <p id="rp-result">Press a button to perform an action.</p>
                <p class="rp-advice" id="rp-advice"></p>
            </div>
        `;

        if (protectionState.lastResult) {
            showProtectionResult(
                protectionState.lastResult.percent,
                protectionState.lastResult.type,
                protectionState.lastResult.feedback,
                protectionState.lastResult.color,
                protectionState.lastResult.advice
            );
        }
    }

    function showProtectionResult(percent, type, feedback, color, advice) {
        const percentElement = document.getElementById("rp-percent");
        const resultElement = document.getElementById("rp-result");
        const adviceElement = document.getElementById("rp-advice");

        if (!percentElement || !resultElement || !adviceElement) return;

        percentElement.textContent = `Index: ${percent}/100`;
        percentElement.style.color = color;
        resultElement.textContent = `${type}: ${feedback}`;
        adviceElement.textContent = advice;
    }

    function performProtectionAction(actionId) {
        if (!protectionState.active || protectionState.gameOver || !window.ARESGame.getState().gameStarted || window.ARESGame.getState().gameOver) return;
        const before = ARESScore.snapshot();
        protectionState.health=before.health;protectionState.hull=before.protection;
        if (protectionState.usedActions.includes(actionId)) return;

        const incident = protectionState.incident;

        if (!incident || incident.scores[actionId] === undefined) return;

        protectionState.usedActions.push(actionId);

        const percent = incident.scores[actionId];
        const feedback = incident.feedback[actionId];

        let color;
        let resultType;
        let advice;

        if (percent >= 90) {
            color = "#42D392";
            resultType = "EXCELLENT DECISION";
        } else if (percent >= 60) {
            color = "#FFC857";
            resultType = "PARTIALLY CORRECT DECISION";
        } else if (percent >= 30) {
            color = "#FF9D55";
            resultType = "INEFFECTIVE DECISION";
        } else {
            color = "#FF647C";
            resultType = "INCORRECT DECISION";
        }

        const rule=percent>=90?(protectionState.usedActions.length===1?'emergencyCorrect':'emergencyFixed'):percent>=60?'emergencyPartial':percent>=30?'emergencyWeak':'emergencyWrong';
        const scoreEntry=ARESScore.award(rule,{key:protectionState.scoreKey+':'+actionId,group:rule==='emergencyPartial'?protectionState.scoreKey+':partial':undefined,limit:1,reason:incident.name+': '+feedback,section:'Emergencies'});
        const scoreNote=`Score ${scoreEntry.delta>0?'+':''}${scoreEntry.delta}. Index ${percent}/100 — a custom relevance score, not a probability.`;
        protectionState.score=ARESScore.total;

        if (percent >= 90) {
            protectionState.health = Math.min(100, protectionState.health + 5);
            protectionState.hull = Math.min(100, protectionState.hull + 5);
            protectionState.shield = Math.min(100, protectionState.shield + 5);

            protectionState.active = false;
            protectionState.incident = null;

            protectionState.level++;

            advice = "Emergency resolved. Health and hull: up to +5 (maximum 100). " + scoreNote;

            protectionState.lastResult = {
                percent,
                type: resultType,
                feedback,
                color,
                advice
            };

            clearInterval(protectionState.timer);
            protectionState.timer = null;

            scheduleNextIncident();
            syncProtection();
            ARESScore.trace("Emergency Resolution",before);
            renderProtectionPage();

            return;
        }

        if (percent >= 60) {
            protectionState.timeLeft = Math.max(0, protectionState.timeLeft - 3);
            protectionState.health = Math.max(0, protectionState.health - 2);
            advice = "This action helped, but the emergency is not resolved yet. Choose another action.";
        } else if (percent >= 30) {
            protectionState.timeLeft = Math.max(0, protectionState.timeLeft - 7);
            protectionState.health = Math.max(0, protectionState.health - 5);
            advice = "You lost time. Review the instructions and try another approach.";
        } else {
            protectionState.timeLeft = Math.max(0, protectionState.timeLeft - 10);
            protectionState.health = Math.max(0, protectionState.health - 8);
            protectionState.hull = Math.max(0, protectionState.hull - 3);
            advice = "The incorrect action made the situation worse.";
        }

        advice += " " + scoreNote + " Actual resource changes have been recorded in the report.";
        protectionState.lastResult = {
            percent,
            type: resultType,
            feedback,
            color,
            advice
        };

        syncProtection();
        ARESScore.trace("Consequence of Emergency Decision",before);
        renderProtectionPage();

        if (protectionState.health <= 0 || protectionState.hull <= 0) {
            setTimeout(endProtectionGame, 700);
            return;
        }

        if (ARESScore.config.timed && protectionState.timeLeft <= 0) {
            protectionTimeout();
        }
    }

    function newProtectionIncident() {
        if (protectionState.gameOver || !protectionState.started) return;

        clearInterval(protectionState.timer);
        clearTimeout(protectionState.nextTimer);

        const randomIndex = Math.floor(ARESScore.random() * protectionIncidents.length);

        protectionState.incident = protectionIncidents[randomIndex];
        protectionState.scoreKey=ARESScore.id("incident");

        protectionState.timeLeft = Math.max(
            20,
            protectionState.incident.time - (protectionState.level - 1) * 3
        );

        protectionState.nextIncidentDay = null;
        protectionState.active = true;
        protectionState.usedActions = [];
        protectionState.lastResult = null;
        protectionState.page = "Emergencies";

        document.querySelectorAll(".rp-nav").forEach(button => {
            button.classList.toggle("active", button.dataset.page === "Emergencies");
        });

        renderProtectionPage();
        startProtectionTimer();

        if (window.ARESGame) {
            window.ARESGame.logEvent(
                `Emergency detected: ${protectionState.incident.name}.`
            );
        }
    }

    function startProtectionTimer() {
        clearInterval(protectionState.timer);

        if(!ARESScore.config.timed)return;
        protectionState.timer = setInterval(() => {
            const st=window.ARESGame.getState();
            if (!protectionState.active || protectionState.gameOver || st.gameOver || st.currentRoom!=='emergency' || document.hidden || document.getElementById('learning-dialog')?.open || document.getElementById('station-dialog')?.open || document.getElementById('minigame-dialog')?.open || document.getElementById('decision-dialog')?.open || document.getElementById('overlay')?.style.display!=='none') return;

            protectionState.timeLeft--;

            const timerElement = document.getElementById("rp-timer");

            if (timerElement) {
                timerElement.textContent =
                    `${ARESScore.config.timed?"TIME LEFT: "+protectionState.timeLeft+" sec.":"TRAINING MODE: NO TIMER"}`;
            }

            if (protectionState.timeLeft <= 0) {
                protectionTimeout();
            }
        }, 1000);
    }

    function protectionTimeout() {
        if (!protectionState.active || window.ARESGame.getState().gameOver) return;
        const before=ARESScore.snapshot();protectionState.health=before.health;protectionState.hull=before.protection;
        const entry=ARESScore.award('emergencyTimeout',{key:protectionState.scoreKey+':timeout',reason:'Emergency was not resolved within the allotted time',section:'Emergencies'});
        protectionState.lastResult={feedback:'Time expired: health −15, hull −12.',advice:`${entry.delta} points. Analyze the cause of the emergency before trying again.`};

        protectionState.active = false;
        protectionState.incident = null;

        clearInterval(protectionState.timer);
        protectionState.timer = null;

        protectionState.health = Math.max(0, protectionState.health - 15);
        protectionState.hull = Math.max(0, protectionState.hull - 12);

        syncProtection();
        ARESScore.trace("Emergency time expired",before);

        if (protectionState.health <= 0 || protectionState.hull <= 0) {
            endProtectionGame();
            return;
        }

        scheduleNextIncident();
        renderProtectionPage();

        if (window.ARESGame) {
            window.ARESGame.logEvent(
                "The time to resolve the emergency has expired. The next emergency is scheduled."
            );
        }
    }

    function endProtectionGame() {
        if (protectionState.gameOver) return;

        protectionState.gameOver = true;
        protectionState.active = false;
        protectionState.incident = null;
        protectionState.nextIncidentDay = null;

        clearInterval(protectionState.timer);
        clearTimeout(protectionState.nextTimer);

        protectionState.timer = null;
        protectionState.nextTimer = null;

        syncProtection();

        if (window.ARESGame) {
            window.ARESGame.finish(
                false,
                "The emergency has brought the station to a critical state."
            );
        }

        renderProtectionGameOver();
    }

    function renderProtectionGameOver() {
        rpMain.innerHTML = `
            <div style="text-align:center; padding:80px 10px;">
                <h1 style="color:#FF647C; font-size:30px;">
                    EMERGENCY STATE
                </h1>

                <p>
                    The station has reached a critical state.<br>
                    The main mission has ended.
                </p>

                <h2 style="color:#36D6D0; margin-top:30px;">
                    FINAL SCORE: ${ARESScore.total}
                </h2>
            </div>
        `;
    }

    function resetProtectionState() {
        clearInterval(protectionState.timer);
        clearTimeout(protectionState.nextTimer);

        protectionState.health = 100;
        protectionState.hull = 100;
        protectionState.shield = 100;
        protectionState.score = 0;
        protectionState.level = 1;
        protectionState.incident = null;
        protectionState.timeLeft = 0;
        protectionState.timer = null;
        protectionState.nextTimer = null;
        protectionState.nextIncidentDay = null;
        protectionState.active = false;
        protectionState.gameOver = false;
        protectionState.started = false;
        protectionState.usedActions = [];
        protectionState.lastResult = null;
        protectionState.page = "Emergencies";

        document.querySelectorAll(".rp-nav").forEach(button => {
            button.classList.toggle("active", button.dataset.page === "Emergencies");
        });

        updateProtectionStats();
        renderProtectionPage();
    }

    protectionRoot.addEventListener("click", event => {
        const pageButton = event.target.closest("[data-page]");

        if (pageButton) {
            switchProtectionPage(pageButton.dataset.page);
            return;
        }

        const actionButton = event.target.closest("[data-action]");

        if (actionButton) {
            performProtectionAction(actionButton.dataset.action);
        }
    });

    window.ARESProtection = {
        status: () => ({active: protectionState.active, name: protectionState.incident?.name || null}),
        refresh: updateProtectionStats,
        start() {
            if (protectionState.started && !protectionState.gameOver) return;

            protectionState.health = window.ARESGame
                ? window.ARESGame.getState().health
                : 100;

            protectionState.hull = window.ARESGame
                ? window.ARESGame.getState().protection
                : 100;

            protectionState.started = true;
            protectionState.gameOver = false;
            protectionState.active = false;

            scheduleNextIncident();
            updateProtectionStats();
            renderProtectionPage();
        },

        onDayPassed(day) {
            if (!protectionState.started || protectionState.gameOver) return;

            if (
                !protectionState.active &&
                protectionState.nextIncidentDay !== null &&
                day >= protectionState.nextIncidentDay
            ) {
                newProtectionIncident();
            } else if (!protectionState.active) {
                renderProtectionWaiting();
            }
        },

        stop() {
            clearInterval(protectionState.timer);
            clearTimeout(protectionState.nextTimer);

            protectionState.timer = null;
            protectionState.nextTimer = null;
            protectionState.nextIncidentDay = null;
            protectionState.active = false;
            protectionState.started = false;
            updateEmergencyNotice();
        },

        reset() {
            resetProtectionState();
        }
    };

    updateProtectionStats();
}

</script>
<script>
// ARES-7 internal module comment

function updateInterface(gameState) {
    if (!gameState) return;
    const dayEl = document.getElementById('turnInfo');
    if (dayEl && gameState.day !== undefined) {
        dayEl.textContent = `Day ${gameState.day} / 20`;
    }
    for (const name of ['energy', 'oxygen', 'water', 'food', 'health', 'protection']) {
        if (gameState[name] !== undefined) updateStat(name, gameState[name]);
    }
    const materials = document.getElementById('materials-count');
    if (materials && gameState.materials !== undefined) {
        materials.textContent = gameState.materials;
    }
}

function updateStat(name, value) {
    const textEl = document.getElementById(`${name}-val`);
    const barEl = document.getElementById(`${name}-bar`);
    const number = Number(value);
    if (textEl) textEl.textContent = `${value}%`;
    if (barEl && Number.isFinite(number)) {
        barEl.style.width = `${Math.max(0, Math.min(100, number))}%`;
        barEl.classList.add('progress-bar');
        barEl.classList.toggle('danger', number < 30);
        barEl.classList.toggle('warning', number >= 30 && number < 60);
    }
}

function switchModule(moduleName, title, description, clickedButton) {
    const titleEl = document.getElementById('sceneTitle');
    const descEl = document.getElementById('desc');
    if (titleEl) titleEl.textContent = title || moduleName || '';
    if (descEl) descEl.textContent = description || '';
    const buttons = document.querySelectorAll('#rooms .nav-btn, #rooms button');
    buttons.forEach(btn => btn.classList.remove('active'));
    if (clickedButton instanceof Element) clickedButton.classList.add('active');
    addLog(`Entered compartment: ${title || moduleName}`);
}

function addLog(message) {
    const logList = document.getElementById('log');
    if (!logList) return;
    const item = document.createElement('div');
    item.className = 'log-item';
    item.textContent = `▶ ${message}`;
    logList.prepend(item);
}

</script>
<script>
const game = {
    day: 1,
    maxDays: 20,
    lastDayCompleted: false,

    energy: 100,
    oxygen: 100,
    water: 100,
    food: 100,
    materials: 20,

    health: 100,
    protection: 100,

    ice: 0,
    regolith: 0,

    powerRestored: false,
    oxygenSystemRestored: false,
    greenhouseRestored: false,
    protectionRestored: false,
    miningRestored: false,
    radioRestored: false,

    signalSent: false,
    stormActive: false,

    vitamins: 2,
    morale: 100,
    activeCrop: null,
    filterDirt: 0,
    ecoMode: false,
    emergencyVentUsed: false,
    vitaminHunger: 0,

    score: 0,

    currentRoom: "command",
    selectedSpaceMission: null,

    gameStarted: false,
    gameOver: false,
    victory: false,

    log: [],
    message: ""
};

const moduleState = new Proxy(game, {
    get(target, property) {
        if (property === "parts") return target.materials;
        if (property === "farm") return target.greenhouseRestored;
        if (property === "life") return target.oxygenSystemRestored;
        if (property === "storm") return target.stormActive ? 1 : 0;

        return target[property];
    },

    set(target, property, value) {
        if (property === "parts") {
            target.materials = value;
            return true;
        }

        if (property === "farm") {
            target.greenhouseRestored = value;
            return true;
        }

        if (property === "life") {
            target.oxygenSystemRestored = value;
            return true;
        }

        if (property === "storm") {
            target.stormActive = Boolean(value);
            return true;
        }

        target[property] = value;
        return true;
    }
});

function clamp(value, min = 0, max = 100) {
    return Math.max(min, Math.min(max, value));
}

function normalizeCost(cost = {}) {
    const result = {};

    for (const key in cost) {
        const resource = key === "parts" ? "materials" : key;
        result[resource] = cost[key];
    }

    return result;
}

function can(cost = {}) {
    const normalized = normalizeCost(cost);

    for (const key in normalized) {
        if (game[key] === undefined || game[key] < normalized[key]) {
            return false;
        }
    }

    return true;
}

function spend(cost = {}) {
    if (!game.gameStarted || game.gameOver) return false;
    const beforeCost = ARESScore.snapshot();
    const normalized = normalizeCost(cost);

    if (!can(normalized)) {
        return false;
    }

    for (const key in normalized) {
        game[key] -= normalized[key];
    }

    ARESScore.trace("Action Cost", beforeCost);
    return true;
}

function resourceName(key) {
    const names = {
        energy: "energy",
        oxygen: "oxygen",
        water: "water",
        food: "food",
        materials: "materials",
        ice: "ice",
        regolith: "regolith", health:"health", protection:"protection", morale:"morale"
    };

    return names[key] || key;
}

function formatCost(cost = {}) {
    const normalized = normalizeCost(cost);

    return Object.entries(normalized)
        .map(([key, value]) => `${value} ${resourceName(key)}`)
        .join(", ");
}

function logEvent(message) {
    game.log.unshift({
        day: game.day,
        message: message
    });

    if (game.log.length > 30) {
        game.log.pop();
    }

    const logElement = document.getElementById("log");

    if (logElement) {
        Game.renderLog();
    }
}

function notice(message) {
    logEvent(message);
}

function act(message, cost = {}, callback) {
    if (!game.gameStarted || game.gameOver) return false;
    if (!can(cost)) {
        logEvent("Not enough resources to perform this action.");
        Game.render();
        return false;
    }

    if (!spend(cost)) {
        return false;
    }

    const beforeEffect = ARESScore.snapshot();
    if (typeof callback === "function") {
        callback();
    }

    ARESScore.trace(message, beforeEffect);
    logEvent(message);
    nextTurn();

    return true;
}

function nextTurn() {
    if (game.gameOver || !game.gameStarted) return;

    Game.nextDay();
}

const Game = {
    rooms: {
        command: {
            name: "Command Center",
            subtitle: "Martian Station Control",
            description: "Manage the mission, check system status, and send a distress signal."
        },

        power: {
            name: "Power Module",
            subtitle: "Power Supply System",
            description: "The power module supplies electricity to the station. Without it, most systems will not work."
        },

        life: {
            name: "Life Support",
            subtitle: "Oxygen, Water, and Ventilation",
            description: "This compartment contains the water purification, oxygen production, and ventilation systems."
        },

        farm: {
            name: "Greenhouse",
            subtitle: "Food Production",
            description: "The greenhouse grows food and maintains the crew’s supplies."
        },

        shield: {
            name: "Shield Compartment",
            subtitle: "Station Hull Protection",
            description: "This compartment contains the systems that protect the station’s outer hull."
        },

        mine: {
            name: "Mining Module",
            subtitle: "Exploring the Surface of Mars",
            description: "Mine ice and regolith here to support the station."
        },

        emergency: {
            name: "Emergency Center",
            subtitle: "RESOURCE PROTECT",
            description: "Emergency response center."
        }
    },

    getState() {
        return moduleState;
    },

    clamp(value, min = 0, max = 100) {
        return clamp(value, min, max);
    },

    logEvent(message) {
        logEvent(message);
    },

    normalizeCost(cost) {
        return normalizeCost(cost);
    },

    canAfford(cost) {
        return can(cost);
    },

    spendResources(cost) {
        return spend(cost);
    },

    resourceName(key) {
        return resourceName(key);
    },

    formatCost(cost) {
        return formatCost(cost);
    },

    performAction(message, cost = {}, callback) {
        return act(message, cost, callback);
    },

    updateProtection(health, hull) {
        game.health = clamp(health);
        game.protection = clamp(hull);

        this.renderHeader();
        this.renderMeters();
    },

    start() {
        if (game.gameOver || game.gameStarted) return;

        game.gameStarted = true;
        this.syncSpaceMapDay();

        const overlay = document.getElementById("overlay");

        if (overlay) {
            overlay.style.display = "none";
        }

        if (window.ARESProtection) {
            window.ARESProtection.start();
        }

        logEvent("ARES-7 mission started.");
        this.render();
    },

    restart() {
        if (window.ARESProtection) {
            window.ARESProtection.stop();

            if (typeof window.ARESProtection.reset === "function") {
                window.ARESProtection.reset();
            }
        }

        const initialState = {
            day: 1,
            maxDays: 20,
            lastDayCompleted: false,

            energy: 100,
            oxygen: 100,
            water: 100,
            food: 100,
            materials: 20,

            health: 100,
            protection: 100,

            ice: 0,
            regolith: 0,

            powerRestored: false,
            oxygenSystemRestored: false,
            greenhouseRestored: false,
            protectionRestored: false,
            miningRestored: false,
            radioRestored: false,

            signalSent: false,
            stormActive: false,

            vitamins: 2,
            morale: 100,
            activeCrop: null,
            filterDirt: 0,
            ecoMode: false,
            emergencyVentUsed: false,
            vitaminHunger: 0,

            score: 0,

            currentRoom: "command",
            selectedSpaceMission: null,

            gameStarted: false,
            gameOver: false,
            victory: false,

            log: [],
            message: ""
        };

        Object.assign(game, initialState);
        ARESScore.reset();
        window.ARESMissions?.reset();
        window.SpaceMap?.reset();
        this.syncSpaceMapDay();

        this.closeSpaceMap();
        this.render();

        this.showModal(
            "Station Restarted",
            "All systems have been restored to their initial state.",
            "You can now start a new mission.",
            "▶ Start Game",
            () => this.start()
        );
    },

    syncSpaceMapDay() {
        if (window.SpaceMap && typeof window.SpaceMap.setDay === "function") {
            window.SpaceMap.setDay(game.day);
        }
    },

    openSpaceMap() {
        const layout = document.querySelector(".layout");
        const mapRoot = document.getElementById("space-map-root");

        if (!layout || !mapRoot || !window.SpaceMap) {
            logEvent("Could not open the space map. Check that space-map.js is connected.");
            return;
        }

        layout.style.display = "none";
        mapRoot.style.display = "block";

        if (!document.getElementById("return-to-ares")) {
            const button = document.createElement("button");

            button.id = "return-to-ares";
            button.type = "button";
            button.textContent = "← Return to ARES-7";

            button.onclick = () => {
                this.closeSpaceMap();
            };

            mapRoot.prepend(button);
        }

        window.scrollTo(0, 0);
    },

    closeSpaceMap() {
        const layout = document.querySelector(".layout");
        const mapRoot = document.getElementById("space-map-root");

        if (layout) {
            layout.style.display = "";
        }

        if (mapRoot) {
            mapRoot.style.display = "none";
        }

        const button = document.getElementById("return-to-ares");

        if (button) {
            button.remove();
        }

        this.render();
        window.scrollTo(0, 0);
    },

    startSpaceMission(detail) {
    if (!detail || !detail.id) return;

    game.selectedSpaceMission = detail.id;

    if (window.ARESMissions) {
        window.ARESMissions.start(detail);
    } else {
        logEvent("Could not load the space mission system.");
    }
},

    selectRoom(room) {
        if (!this.rooms[room] || game.gameOver) return;

        game.currentRoom = room;

        const protectionRoot = document.getElementById("protection-root");

        if (protectionRoot) {
            protectionRoot.style.display =
                room === "emergency" ? "block" : "none";
        }

        this.render();
    },

    nextDay() {
        if (game.gameOver || !game.gameStarted) return;
        const beforeDay = ARESScore.snapshot();

        // Day 20 remains playable. The next station action closes that day;
        // never display a fictitious day 21 or schedule another day’s events.
        const closingLastDay = game.day >= game.maxDays;
        if (closingLastDay) game.lastDayCompleted = true;
        else game.day++;
        this.syncSpaceMapDay();
        window.ARESAdventure?.beforeDay();

        if (game.powerRestored) {
            game.energy = clamp(game.energy - 2);
        } else {
            game.energy = clamp(game.energy - 5);
        }

        if (typeof updateLifeTurn === "function") {
            updateLifeTurn(moduleState);
        } else {
            game.oxygen = clamp(game.oxygen - 5);
            game.water = clamp(game.water - 3);
            game.food = clamp(game.food - 2);
        }

        if (typeof updateFarmTurn === "function") {
            updateFarmTurn(moduleState);
        } else {
            game.food = clamp(game.food - 2);
        }

        if (!closingLastDay) this.checkEvents();

        if (
            !closingLastDay && window.ARESProtection &&
            typeof window.ARESProtection.onDayPassed === "function"
        ) {
            window.ARESProtection.onDayPassed(game.day);
        }

        ARESScore.trace("Daily Consumption and Events", beforeDay);
        this.checkGameOver();
        window.ARESAdventure?.record();
        this.render();
    },

    checkEvents() {
        if (game.adventure && window.ARESAdventure) { window.ARESAdventure.events(); return; }
        if (game.day === 5 || game.day === 12) {
            game.stormActive = true;

            game.energy = clamp(game.energy - 8);
            game.protection = clamp(game.protection - 5);

            logEvent("A dust storm has begun on Mars. Check the station.");
        }

        if (game.day === 8 || game.day === 15) {
            game.stormActive = false;

            logEvent("The dust storm has ended.");
        }

        if (game.day === 9) {
            game.water = clamp(game.water - 12);

            logEvent("A water leak was detected. Supplies decreased by 12 units.");
        }

        if (game.day === 15) {
            game.energy = clamp(game.energy - 10);

            logEvent("The power module has lost some capacity.");
        }

        if (game.day === 10) {
            game.food = clamp(game.food + 5);

            logEvent("A backup food container was found (+5 food).");
        }

        if (game.day === 18) {
            logEvent("Two days remain until the mission ends.");
        }
    },

    checkGameOver() {
        if (game.gameOver) return;

        if (
            game.health <= 0 ||
            game.oxygen <= 0 ||
            game.water <= 0 ||
            game.food <= 0 ||
            game.protection <= 0
        ) {
            this.finish(
                false,
                "The station can no longer sustain the crew."
            );

            return;
        }

        if (game.lastDayCompleted) {
            if (game.signalSent) {
                this.finish(
                    true,
                    "Distress signal transmitted. The ARES-7 mission was successfully completed!"
                );
            } else {
                this.finish(
                    false,
                    "20 days have passed, but the distress signal was never sent."
                );
            }
        }
    },

    finish(victory, message) {
        if (game.gameOver) return;

        game.gameOver = true;
        game.victory = victory;
        game.message = message;

        if (window.ARESProtection) {
            window.ARESProtection.stop();
        }

        const repaired = [
            game.powerRestored,
            game.oxygenSystemRestored,
            game.greenhouseRestored,
            game.protectionRestored,
            game.miningRestored,
            game.radioRestored
        ].filter(Boolean).length;

        const result = victory ? "MISSION COMPLETED" : "MISSION FAILED";

        this.showModal(
            result,
            message,
            `Systems restored: ${repaired}/6. Score: ${game.score}.`,
            "↻ New Game",
            () => this.restart()
        );

        logEvent(message);
    },

    showModal(title, description, extra, buttonText, callback) {
        const overlay = document.getElementById("overlay");
        const modal = document.getElementById("modal");

        if (!overlay || !modal) return;

        modal.innerHTML = `
            <div class="sub">ARES-7 // MISSION CONTROL</div>

            <h1>${title}</h1>

            <p>${description}</p>

            <p>${extra}</p>

            <button id="modalAction"
                style="width:100%; margin-top:15px;">
                ${buttonText}
            </button>
        `;

        const button = document.getElementById("modalAction");

        if (button) {
            button.onclick = () => {
                overlay.style.display = "none";

                if (typeof callback === "function") {
                    callback();
                }
            };
        }

        overlay.style.display = "flex";
    },

    getActions() {
        const actions = [];

        const add = (label, cost, condition, callback, help, id) => {
            actions.push({
                id,
                label,
                cost,
                enabled: condition && can(cost),
                run: callback,
                help
            });
        };

        if (game.currentRoom === "power") {
            add(
                "🔌 Restore Power Module",
                { materials: 3, energy: 5 },
                !game.powerRestored,
                () => act(
                    "Power module restored.",
                    { materials: 3, energy: 5 },
                    () => {
                        game.powerRestored = true;
                        game.energy = clamp(game.energy + 20);
                        ARESScore.award("repair", {key:"repair:power",reason:"Restoration: Power Systems"});
                    }
                ),
                "Restores the station’s power supply."
            );

            add(
                "⚡ Recharge Batteries",
                { energy: 5 },
                game.powerRestored,
                () => act(
                    "Batteries recharged (+20 energy).",
                    { energy: 5 },
                    () => {
                        game.energy = clamp(game.energy + 20);
                    }
                ),
                "Replenishes the energy supply."
            );
        }

        if (game.currentRoom === "life") {
            if (typeof getLifeChoices === "function") {
                return getLifeChoices(moduleState);
            }
        }

        if (game.currentRoom === "farm") {
            if (typeof getFarmChoices === "function") {
                return getFarmChoices(moduleState);
            }
        }

        if (game.currentRoom === "shield") {
            add(
                "🛡️ Restore Protective Shield",
                { materials: 4, energy: 8 },
                !game.protectionRestored,
                () => act(
                    "Protective shield restored.",
                    { materials: 4, energy: 8 },
                    () => {
                        game.protectionRestored = true;
                        game.protection = clamp(game.protection + 30);
                        ARESScore.award("repair", {key:"repair:shield",reason:"Restoration: protection"});
                    }
                ),
                "Improves hull protection.", "shieldRepair"
            );

            add(
                "🔧 Repair Hull",
                { materials: 3, energy: 5 },
                game.protection < 100,
                () => act(
                    "Station hull repaired.",
                    { materials: 3, energy: 5 },
                    () => {
                        game.protection = clamp(game.protection + 20);
                    }
                ),
                "Restores hull integrity.", "hullRepair"
            );
        }

        if (game.currentRoom === "mine") {
            add("🔧 Restore Mining Module", {materials:2,energy:4}, !game.miningRestored,
              () => act("Mining module restored",{materials:2,energy:4},()=>{game.miningRestored=true;ARESScore.award("repair",{key:"repair:mine",reason:"Mining module restoration"});}),"Required for extracting ice and regolith.", "mineRepair");
            add(
                "⛏️ Extract Ice",
                { energy: 5 },
                game.miningRestored && game.energy >= 5,
                () => act(
                    "10 units of ice extracted.",
                    { energy: 5 },
                    () => {
                        game.ice += 10;
                        game.water = clamp(game.water + 5);
                        ARESScore.award("mining", {key:ARESScore.id("mine"),group:"mine:ice",reason:"Mining: ice"});
                    }
                ),
                "Obtain ice and partially replenish water.", "ice"
            );

            add(
                "🪨 Extract Regolith",
                { energy: 4 },
                game.miningRestored && game.energy >= 4,
                () => act(
                    "5 units of regolith extracted.",
                    { energy: 4 },
                    () => {
                        game.regolith += 5;
                        game.materials += 2;
                        ARESScore.award("mining", {key:ARESScore.id("mine"),group:"mine:regolith",reason:"Mining: regolith"});
                    }
                ),
                "Obtain materials for repairs.", "regolith"
            );

            add(
                "📦 Process Regolith",
                { regolith: 5, energy: 3 },
                game.regolith >= 5,
                () => act(
                    "Regolith processed. 3 materials obtained.",
                    { regolith: 5, energy: 3 },
                    () => {
                        game.materials += 3;
                    }
                ),
                "Converts regolith into materials."
            );
        }

        if (game.currentRoom === "command") {
            add(
                "📡 Restore Radio Communications",
                { materials: 3, energy: 8 },
                !game.radioRestored,
                () => act(
                    "Radio system restored.",
                    { materials: 3, energy: 8 },
                    () => {
                        game.radioRestored = true;
                        ARESScore.award("repair", {key:"repair:radio",reason:"Restoration: Radio Communications"});
                    }
                ),
                "Allows the distress signal to be prepared."
            );

            add(
                "🚀 Send Distress Signal",
                { energy: 10 },
                game.radioRestored && !game.signalSent,
                () => act(
                    "Distress signal transmitted!",
                    { energy: 10 },
                    () => {
                        game.signalSent = true;
                        ARESScore.award("signal", {key:"signal",reason:"Distress signal transmitted"});
                    }
                ),
                "Radio communications must be restored first."
            );

            add(
                "📊 Check Station Status",
                {},
                true,
                () => {
                    logEvent("Station systems have been checked.");
                    this.render();
                },
                "Check current readings."
            );
        }

        return actions;
    },

    render() {
        window.ARESProtection?.refresh();
        this.renderHeader();
        this.renderRooms();
        this.renderScene();
        this.renderActions();
        this.renderMeters();
        this.renderInventory();
        this.renderObjectives();
        this.renderLog();
    },

    renderHeader() {
        const element = document.getElementById("turnInfo");

        if (element) {
            element.textContent =
                `DAY ${game.day}/${game.maxDays}`;
        }
    },

    renderRooms() {
        const element = document.getElementById("rooms");

        if (!element) return;

        element.innerHTML = Object.entries(this.rooms).map(([id, room]) => `
            <button
                class="room-button ${game.currentRoom === id ? "active" : ""}"
                data-room="${id}">
                ${room.name}
            </button>
        `).join("");

        element.querySelectorAll("[data-room]").forEach(button => {
            button.onclick = () => {
                this.selectRoom(button.dataset.room);
            };
        });
    },

    renderScene() {
        const room = this.rooms[game.currentRoom];

        if (!room) return;

        const title = document.getElementById("sceneTitle");
        const subtitle = document.getElementById("sceneSub");
        const tag = document.getElementById("roomTag");
        const description = document.getElementById("desc");
        const weather = document.getElementById("weatherTag");
        const supply = document.getElementById("supplyTag");

        if (title) title.textContent = room.name;
        if (subtitle) subtitle.textContent = room.subtitle;
        if (tag) tag.textContent = game.currentRoom.toUpperCase();
        if (description) description.textContent = room.description;

        if (weather) {
            weather.textContent = game.stormActive
                ? "DUST STORM"
                : "WEATHER: STABLE";
        }

        if (supply) {
            supply.textContent = game.powerRestored
                ? "ENERGY: STABLE"
                : "ENERGY: LIMITED";
        }

        const eventBox = document.getElementById("eventBox");

        if (eventBox) {
            eventBox.textContent = game.message || "";
        }

        const protectionRoot = document.getElementById("protection-root");

        if (protectionRoot) {
            protectionRoot.style.display =
                game.currentRoom === "emergency" ? "block" : "none";
        }
    },

    actionBlockReason(action) {
        if (!game.gameStarted) return 'Press “Start Game” first.';
        if (game.gameOver) return 'Mission completed. Start a new game.';
        if (!can(action.cost)) return 'Not enough resources. Required: ' + formatCost(action.cost);
        const label=action.label;
        if (/Send Distress Signal/i.test(label)) return game.signalSent?'The signal has already been transmitted.':'Restore radio communications first.';
        if (/Restore|Start Oxygen Module/i.test(label)) return 'This system has already been restored.';
        if (/Recharge/i.test(label)) return 'Restore the power module first.';
        if (/Grow|Synthesize/i.test(label)&&!game.greenhouseRestored) return 'Restore the greenhouse first.';
        if (/Extract/i.test(label)&&!game.miningRestored) return 'Restore the mining module first.';
        if (/tanks|filters|condensate|saving mode/i.test(label)&&!game.oxygenSystemRestored) return 'Start the oxygen module first.';
        if (/filters/i.test(label)) return 'The filters are already clean; no maintenance is needed now.';
        if (/Crew Rest/i.test(label)) return 'Crew morale is already at maximum.';
        if (/Take Vitamin/i.test(label)) return game.vitamins<=0?'No vitamin packs available.':'The health meter is already full.';
        if (/Synthesize/i.test(label)) return 'The supply of packs is already at its maximum (5).';
        if (/hull/i.test(label)) return 'The hull is already at full integrity.';
        if (/saving mode/i.test(label)) return 'Economy mode is already active for the next turn.';
        return 'This action is currently unavailable: check resources and system status.';
    },

    renderActions() {
        const element = document.getElementById("actions");

        if (!element) return;

        if (game.currentRoom === "emergency") {
            element.innerHTML = `
                <p>The emergency module is available in this compartment.</p>
            `;
            return;
        }

        const actions = this.getActions();

        if (actions.length === 0) {
            element.innerHTML = "<p>No actions available.</p>";
            return;
        }

        element.innerHTML = actions.map((action, index) => `
            <article class="action-card">
            <button
                class="action-button ${action.enabled && game.gameStarted && !game.gameOver ? "" : "unavailable"}"
                data-action-index="${index}">
                ${action.label}${action.enabled && game.gameStarted && !game.gameOver ? "" : " · ⓘ"}
            </button>
            <small class="action-help">Cost: ${formatCost(action.cost) || "no cost"}</small>

            ${action.help ? `<div class="action-help">${action.help}</div>` : ""}
            ${action.enabled && game.gameStarted && !game.gameOver ? "" : `<p class="blocked-reason">${this.actionBlockReason(action)}</p>`}
            </article>
        `).join("");

        element.querySelectorAll("[data-action-index]").forEach(button => {
            button.onclick = () => {
                const action = actions[Number(button.dataset.actionIndex)];

                if (!action) return;
                if (!action.enabled || !game.gameStarted || game.gameOver) {
                    logEvent(this.actionBlockReason(action));
                    const reason = button.closest('.action-card')?.querySelector('.blocked-reason');
                    if (reason) reason.textContent = this.actionBlockReason(action);
                    return;
                }

                const callback = action.run || action.callback;

                if (typeof callback === "function") {
                    callback();
                }

                this.render();
            };
        });
    },

    renderMeters() {
        const element = document.getElementById("meters");

        if (!element) return;

        const meters = [
            ["Health", game.health],
            ["Energy", game.energy],
            ["Oxygen", game.oxygen],
            ["Water", game.water],
            ["Food", game.food],
            ["Protection", game.protection],
            ["Morale", game.morale]
        ];

        element.innerHTML = meters.map(([name, value]) => `
            <div class="meter">
                <div class="meter-heading">
                    <span>${name}</span>
                    <strong>${Math.round(value)}%</strong>
                </div>

                <div class="meter-track">
                    <div class="meter-fill"
                        style="width:${clamp(value)}%">
                    </div>
                </div>
            </div>
        `).join("");
    },

    renderInventory() {
        const element = document.getElementById("inventory");

        if (!element) return;

        const resources = [
            ["⚡ Energy", game.energy],
            ["🫁 Oxygen", game.oxygen],
            ["💧 Water", game.water],
            ["🍎 Food", game.food],
            ["🔩 Materials", game.materials],
            ["🧊 Ice", game.ice],
            ["🪨 Regolith", game.regolith],
            ["💊 Vitamins", game.vitamins]
        ];

        element.innerHTML = resources.map(([name, value]) => `
            <div class="inventory-item">
                <span>${name}</span>
                <strong>${value}</strong>
            </div>
        `).join("");
    },

    renderObjectives() {
        const element = document.getElementById("objectives");

        if (!element) return;

        const objectives = [
            ["Restore Power Module", game.powerRestored],
            ["Start Oxygen Module", game.oxygenSystemRestored],
            ["Restore Greenhouse", game.greenhouseRestored],
            ["Restore Protective Shield", game.protectionRestored],
            ["Restore Mining Module", game.miningRestored],
            ["Restore Radio Communications", game.radioRestored],
            ["Send Distress Signal", game.signalSent]
        ];

        element.innerHTML = objectives.map(([name, completed]) => `
            <div class="objective ${completed ? "completed" : ""}">
                <span>${completed ? "✓" : "○"}</span>
                ${name}
            </div>
        `).join("");
    },

    renderLog() {
        const element = document.getElementById("log");

        if (!element) return;

        element.innerHTML = game.log.map(item => `
            <div class="log-entry">
                <strong>Day ${item.day}:</strong>
                ${item.message}
            </div>
        `).join("");
    }
};

window.ARESGame = Game;

window.start = () => Game.start();
window.restart = () => Game.restart();

window.clamp = clamp;
window.can = can;
window.spend = spend;
window.act = act;
window.nextTurn = nextTurn;
window.render = () => Game.render();
window.notice = notice;

document.addEventListener("DOMContentLoaded", () => {
    Game.render();
    Game.syncSpaceMapDay();

    const mapButton = document.getElementById("open-space-map");

    if (mapButton) {
        mapButton.addEventListener("click", () => {
            Game.openSpaceMap();
        });
    }

    if (window.SpaceMap) {
        window.SpaceMap.onMissionSelect(detail => {
            Game.startSpaceMission(detail);
        });
    }

    Game.showModal(
        "Welcome to ARES-7 Station",
        "Your mission is to restore the station and save the crew.",
        "You have 20 days. Use your resources wisely.",
        "▶ Start Game",
        () => Game.start()
    );
});

        .sm-toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            background: #163b54;
            border: 1px solid #37ddf5;

                </div>

                            M120 125
                            Q260 250 350 250
                            T610 125
                            Q710 260 690 370
                            Q570 460 470 475
                            Q280 500 160 430
                            Q60 280 120 125
                        "/>

                        <path d="
                            M400 285 L120 125
                            M400 285 L350 250
                            M400 285 L610 125
                            M400 285 L160 430
                            M400 285 L470 475
                            M400 285 L690 370
                        "/>

                    </svg>

                    </div>

                <aside class="sm-side">

                    <h2>COMMAND CENTER</h2>

                    <div class="sm-kicker">

    /* ======================================

    const map = root.querySelector(".sm-map");

    const title = root.querySelector(".sm-location");

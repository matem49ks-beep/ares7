    const launchButton = root.querySelector(".sm-launch");
    const resetButton = root.querySelector(".sm-reset");

    const progressFill = root.querySelector(
        ".sm-progress-fill"
    );

    const progressText = root.querySelector(
        ".sm-progress-text"
    );

    const toast = root.querySelector(".sm-toast");

    /* ======================================
       MESSAGES
    ====================================== */

    function notify(message) {
        toast.textContent = message;
        toast.style.display = "block";

        clearTimeout(notify.timer);

        notify.timer = setTimeout(() => {
            toast.style.display = "none";
        }, 2800);
    }

    /* ======================================
       STARS
    ====================================== */

    function createStars() {
        const stars = root.querySelector(".sm-stars");

        for (let i = 0; i < 100; i++) {
            const star = document.createElement("i");

            star.className = "sm-star";

            star.style.left =
                ((i * 73) % 997) / 10 + "%";

            star.style.top =
                ((i * 137) % 991) / 10 + "%";

            star.style.opacity =
                0.25 + (i % 7) / 10;

            stars.appendChild(star);
        }
    }

    /* ======================================
       PROGRESS
    ====================================== */

    function updateProgress() {
        const count = completedMissions.size;

        progressFill.style.width =
            (count / missions.length * 100) + "%";

        progressText.textContent =
            count + " of " + missions.length + " missions completed";
    }

    /* ======================================
       RENDERING MAP
    ====================================== */

    function drawMap() {
        nodes.innerHTML = "";

        missions.forEach((mission, index) => {

            const done =
                completedMissions.has(mission.id);
            const locked = currentDay < mission.unlockDay;

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "sm-node" +
                (done ? " done" : "") +
                (locked ? " locked" : "") +
                (selectedMission === mission.id
                    ? " active"
                    : "");

            button.style.left =
                positions[index][0] + "%";

            button.style.top =
                positions[index][1] + "%";
            button.disabled = locked;

            button.setAttribute(
                "aria-label",
                mission.name
            );

            button.innerHTML = `
                <span class="sm-orb"
                      style="background:${mission.color}">
                    ${done ? "✓" : mission.icon}
                </span>

                <span class="sm-node-name">
                    ${mission.name}
                </span>

                <span class="sm-node-status">
                    ${done ? "COMPLETED" : locked ? "UNLOCKS: DAY " + mission.unlockDay : "AVAILABLE"}
                </span>
            `;

            button.addEventListener("click", () => {
                if (locked) {
                    notify("This location unlocks on Day " + mission.unlockDay + " .");
                    return;
                }
                selectMission(mission.id);
            });

            nodes.appendChild(button);
        });
    }

    /* ======================================
       MISSION SELECTION
    ====================================== */

    function selectMission(id) {

        const mission = missions.find(
            item => item.id === id
        );

        if (!mission) return;
        if (currentDay < mission.unlockDay) {
            notify("Location unlocks on Day " + mission.unlockDay + " .");
            return;
        }

        selectedMission = id;

        title.textContent = mission.name;

        title.style.color = mission.color;

        description.textContent =
            mission.subtitle + " — " +
            mission.description;

        launchButton.disabled = false;

        launchButton.textContent =
            completedMissions.has(id)
                ? "REPLAY MISSION"
                : "START MISSION";

        drawMap();
    }

    /* ======================================
       LAUNCH MISSION
    ====================================== */

    launchButton.addEventListener("click", () => {

        if (!selectedMission) {
            notify("Select a location first!");
            return;
        }

        const mission = missions.find(
            item => item.id === selectedMission
        );

        if (!mission || currentDay < mission.unlockDay) {
            notify("This location is still locked.");
            return;
        }

        const detail = {
            id: mission.id,
            name: mission.name,
            mission: mission
        };

        window.dispatchEvent(
            new CustomEvent(
                "space:missionSelected",
                { detail }
            )
        );

        if (typeof SpaceMap.onSelect === "function") {
            SpaceMap.onSelect(detail);
        } else {
            notify(
                "Selected mission: " + mission.name +
                ". Your mission needs to be connected."
            );
        }
    });

    /* ======================================
       RESET PROGRESS
    ====================================== */

    resetButton.textContent = "DECISION LOG";
    resetButton.addEventListener("click", () => window.ARESLearning?.journal());

    /* ======================================
       API FOR CONNECTING YOUR MISSIONS
    ====================================== */

    window.SpaceMap = {
        reset() {completedMissions.clear();selectedMission=null;currentDay=1;drawMap();updateProgress();},

        missions: missions,

        onSelect: null,

        setDay(day) {
            const nextDay = Math.max(1, Number(day) || 1);
            currentDay = nextDay;

            if (selectedMission) {
                const selected = missions.find(item => item.id === selectedMission);
                if (!selected || currentDay < selected.unlockDay) {
                    selectedMission = null;
                    title.textContent = "None selected";
                    title.style.color = "";
                    description.textContent = "Select an available planet or station to view its mission.";
                    launchButton.disabled = true;
                    launchButton.textContent = "SELECT A LOCATION";
                }
            }

            drawMap();
            updateProgress();
        },

        getDay() {
            return currentDay;
        },

        onMissionSelect(callback) {

            if (typeof callback !== "function") {
                throw new TypeError(
                    "A function must be provided."
                );
            }

            this.onSelect = callback;
        },

        setMissionStatus(id, status) {

            const exists = missions.some(
                mission => mission.id === id
            );

            if (!exists) {
                throw new Error(
                    "Unknown mission: " + id
                );
            }

            if (status === "completed") {
                completedMissions.add(id);
            } else if (status === "available") {
                completedMissions.delete(id);
            } else {
                throw new Error(
                    'Status must be "available" or "completed".'
                );
            }

            updateProgress();
            drawMap();

            if (selectedMission) {
                selectMission(selectedMission);
            }
        },

        returnToMap() {
            root.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        },

        getCompletedMissions() {
            return [...completedMissions];
        },

        getSelectedMission() {
            return selectedMission;
        }
    };

    /* ======================================
       LAUNCH
    ====================================== */

    createStars();
    drawMap();
    updateProgress();

})();
</script>

const ARESMissions = {
 current:null,currentId:null,step:0,completed:[],progress:{},
 reset(){this.current=null;this.currentId=null;this.step=0;this.completed=[];this.progress={};const r=document.getElementById('mission-root');if(r){r.innerHTML='';r.style.display='none';}},
 start(detail){
  const state=window.ARESGame.getState(),mission=missionData[detail.id];

 },
 render(){
  const root=document.getElementById('mission-root');if(!root||!this.current)return;
  const m=this.current,t=m.tasks[this.step],p=this.progress[this.currentId];if(!t)return;
  root.innerHTML=`<div class="ares-mission"><div class="ares-mission-top"><button id="mission-back">← Back to Space Map</button><span>TRAINING EXPEDITION</span></div><div class="ares-mission-header" style="border-color:${m.color}"><div class="ares-mission-icon">${m.icon}</div><div><h1>${m.name}</h1><p>${m.subtitle}</p></div></div><p>${m.description}</p><p class="learn-muted">${['ice','lab','galaxy'].includes(this.currentId)?'Fictional scenario: the focus is on decision-making, not the actual existence of this location.':'Original scenario. Readings and rewards are part of a training model.'}</p><p>STAGE ${this.step+1} / ${m.tasks.length} · Correct on first try +${ARESScore.value('missionCorrect')}; mistake ${ARESScore.value('missionWrong')} and −2 energy; correction +${ARESScore.value('missionFixed')}.</p><div class="ares-mission-task"><h2>${t.title}</h2><p>${t.description}</p><div class="ares-mission-choices">${t.choices.map((c,i)=>`<button data-choice="${i}" ${p.resolved[this.step]||p.wrong[this.step]?.includes(i)?'disabled':''}>${c}</button>`).join('')}</div><p id="mission-feedback" role="status">${p.resolved[this.step]?t.success:p.wrong[this.step]?.length?'Earlier mistakes are recorded. Reread the instructions and choose how to address the cause.':''}</p></div></div>`;
  document.getElementById('mission-back').onclick=()=>this.returnToMap();
  root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>this.choose(Number(b.dataset.choice)));
  if(p.resolved[this.step])this.addNext();
 },
 choose(index){
  const state=window.ARESGame.getState();if(!this.current||!state.gameStarted||state.gameOver)return;
  const t=this.current.tasks[this.step],p=this.progress[this.currentId];
  if(p.resolved[this.step]||!Number.isInteger(index)||!t.choices[index])return;
  p.wrong[this.step]??=[];if(p.wrong[this.step].includes(index))return;
  const key=`mission:${this.currentId}:${this.step}`;
  if(index!==t.correct){
   p.wrong[this.step].push(index);
   const reason=t.wrongReasons[index];const e=ARESScore.award('missionWrong',{key:key+':wrong:'+index,reason:t.title+': '+reason,section:this.current.name});
   ARESScore.effects('Expedition mistake: '+t.title,{energy:-2});this.render();
   const f=document.getElementById('mission-feedback');f.textContent=`${e.delta} points, −2 energy. ${reason} Try a different decision.`;f.style.color='#ffb2b8';
  }else{
   const e=ARESScore.award(p.wrong[this.step].length?'missionFixed':'missionCorrect',{key:key+':done',reason:t.title+': '+t.success,section:this.current.name});
   p.resolved[this.step]=true;this.render();const f=document.getElementById('mission-feedback');f.textContent=`+${e.delta} points. ${t.success} The decision is based on checking system status, preserving data, or controlling risk.`;f.style.color='#65e6a1';
  }
  window.ARESGame.render();
 },
 addNext(){const button=document.createElement('button');button.className='ares-mission-next';button.textContent=this.step===this.current.tasks.length-1?'Complete Mission':'Next Stage →';document.querySelector('.ares-mission-task').appendChild(button);button.onclick=()=>{if(window.ARESGame.getState().gameOver)return;this.step++;this.progress[this.currentId].step=this.step;if(this.step>=this.current.tasks.length)this.finish();else this.render();};},
 finish(){
  const state=window.ARESGame.getState();if(!this.current||!state.gameStarted||state.gameOver)return;
  const id=this.currentId,p=this.progress[id];if(Object.keys(p.resolved).length!==this.current.tasks.length)return;
  const first=!this.completed.includes(id);let delta=0;
  if(first){this.completed.push(id);delta=ARESScore.award('missionComplete',{key:'mission:'+id+':complete',reason:'All stages completed: '+this.current.name,section:this.current.name}).delta;ARESScore.effects('Expedition Reward',{materials:3,energy:5});}
  window.SpaceMap?.setMissionStatus(id,'completed');
  document.getElementById('mission-root').innerHTML=`<div class="ares-mission ares-mission-finished"><div class="ares-mission-success">✓</div><h1>MISSION COMPLETED</h1><h2>${this.current.name}</h2><p>${first?`Completion bonus: +${delta} points, +3 materials, up to +5 energy (maximum 100).`:'This mission has already been scored. No additional bonus is available.'}</p><p>Mistakes remain on record. See the decision log for a full explanation.</p><button id="mission-finish-button">Back to Space Map</button><button id="mission-protocol">Explain Score</button></div>`;
  document.getElementById('mission-finish-button').onclick=()=>this.returnToMap();document.getElementById('mission-protocol').onclick=()=>window.ARESLearning.journal();window.ARESGame.render();
 },
 returnToMap(){document.getElementById('mission-root').style.display='none';this.current=null;this.currentId=null;window.ARESGame.openSpaceMap();}
};

 function about(){dialog('Mission: Survive and Understand Your Decisions',`
  <p>You manage a training simulation of a Martian station. Your goal is to restore essential systems, send a distress signal, and keep the crew alive through Day 20. You can still perform actions on Day 20; the final outcome is determined after the management action on that day.</p>

  <h3>Four interactive challenges</h3><p>Mining: scan and drill a grid. Repair: rotate tiles to complete a circuit. Life support: balance three valves. Expeditions: steer a craft, collect signals, and avoid debris. Read the instructions before starting. Pausing is free; quitting after starting counts as a failed attempt.</p>
  <h3>What is science and what is fiction?</h3><p>Life support and plant-growing concepts are informed by NASA educational resources. Numeric values, emergencies, points, and rapid travel between worlds are fictional training simplifications. The “Alien Laboratory” and “Mysterious Galaxy” are science-fiction scenarios, not NASA discoveries. The Neptune mission is a remote investigation, not a landing on a solid surface.</p>

  <div class="learn-note">This game runs locally. It does not receive NASA telemetry, Martian weather, or real sensor data. NASA references explain scientific concepts; all numerical parameters in the game are set by the authors.</div>

  <tr><td>Storms and leaks</td><td>In “First Signal,” storms start on Days 5 and 12 and end on Days 8 and 15; the water leak occurs on Day 9. Other scenarios have their own event schedules shown on the map. Restored systems may reduce losses. These are authored events, not NASA weather forecasts.</td></tr>

  <tr><td>Emergency action suitability</td><td>The incident.scores table in protection.js contains the authored 0–100 suitability indices. They are not probabilities or NASA statistics.</td></tr>
  <tr><td>Minigame fields</td><td>The seeded generator in minigames/models.js creates deposits, tile rotations, valve targets, and debris patterns. These are generated challenges, not surface imagery or telemetry. The initial seed comes from the shared scenario; reproducing a result requires the same launch sequence.</td></tr>
  <tr><td>Points</td><td>scoring.js contains one scoring rubric selected before starting. The score is the sum of all actual scoring changes recorded in the log, including negative values.</td></tr></tbody></table>
  <h3>Scenarios, trade-offs, and connections</h3><p>The greenhouse can be paused, saving up to 2 energy and avoiding growing costs, but food decreases rather than increases. A backup airlock may be dismantled for +5 materials at a cost of −12 protection. These decisions present their consequences in advance, cost one day, and award no separate points.</p><p>A repair below 80% quality is temporary, failing again after 3 day changes. Before then, it may be secured for 3 materials, 2 energy, and one day. Accurate drill repair grants +2 drill actions for each of the next two mining runs. A successful flight grants a map worth +1 scan. Accurate shield repair saves 2 protection on the first collision during each of the next two flights; mistake penalties remain.</p>
  <h3>How skill affects resources</h3><p>Mining: n is the number of deposits collected on success, or half that number rounded down on failure. Ice: +2n ice and +floor(0.8n) water. Regolith: +n regolith and +floor(0.5n) materials. Repair quality q = 1 − 0.2 × failed checks. A successful hull repair grants round(12 + 18q) protection. Stabilization quality q = max(0.5, 1 − time/70); the oxygen reserve grants round(12 + 18q) oxygen. Meter limits, action costs, and daily consumption are applied separately.</p>
  <h3>Example daily calculation</h3><p>Oxygen starts at 60, the module is on, enough energy is available, and filters are 55% contaminated: consumption = 0.5 × 1.5 = 0.75. After a normal day: 60 − 0.75 = 59.25. With a one-time economy mode, consumption is multiplied by another 0.5 (minimum 0.2), while morale decreases by 15.</p>
  <details><summary>Complete daily update</summary><p>Energy −2 after repair or −5 without it. Filter contamination +25 during storms or +5 otherwise (maximum 100). Water −3; an operating greenhouse also consumes 2 water and adds 4 food; otherwise food −2. A paused greenhouse produces no food and saves up to 2 energy while retaining its repair status. Daily events are then applied. At storm onset: energy −8, protection −5; on Day 9 water −12; on Day 10 food +5; on Day 15 energy −10. End conditions are checked afterward.</p><p>With low oxygen or water, morale decreases by 8; otherwise it recovers by 2. Below 25 morale, health decreases by 4. If oxygen is below 18, water below 12, food below 10, or energy below 2, health decreases by 11; in favorable conditions health increases by 2. The one-time oxygen reserve adds 20 oxygen and costs 15 energy when oxygen falls below 15. An illustrative food-support counter deducts 5 health after five days without replenishment, then resets to 3. These are game parameters, not medical standards.</p></details>
  <h3>Scientific sources</h3>${sources.map(s=>`<article class="source-card"><a href="${s.url}" target="_blank" rel="noopener">${s.name} ↗</a><p>${s.use}</p></article>`).join('')}
  <p class="learn-muted">Sources reviewed November 14, 2026. Training scenarios are not technical or medical instructions.</p>`);}
 function rubric(){dialog('How “+” and “−” Are Scored',`
  <div class="learn-note">The score starts at 0 and may become negative. Resource meters and educational points are different quantities. Normal daily resource consumption is not a points penalty.</div>
  <p><b>Scoring procedure:</b> check active mission → check whether the action is repeated → determine the rule → check bonus limits → apply the score change → log the reason and consequences.</p>
  <table><thead><tr><th>Event</th><th>Change</th></tr></thead><tbody>${Object.entries(C.rules).map(([id,r])=>`<tr><td>${r.label}</td><td class="${S.value(id)>0?'positive':'negative'}">${num(S.value(id))}</td></tr>`).join('')}</tbody></table>
  <h3>Emergencies: suitability index and scoring</h3><p>90–100: correct action; 60–89: partially useful; 30–59: ineffective; 0–29: incorrect. Correct resolution after any earlier attempt counts as a correction. A partially useful positive bonus is awarded only once per incident.</p>
  <h3>Example: a flight with a mistake</h3><p>One collision earns ${num(S.value('flightError'))} points, then successfully finishing the stage earns ${num(S.value('missionFixed'))}: total <b>${num(S.value('flightError')+S.value('missionFixed'))}</b>. A clean first attempt would earn ${num(S.value('missionCorrect'))}. Launch costs 2 energy and each collision costs 2 protection. Missing signals incurs another scoring error; aborting incurs at least one. Recorded collisions determine hull damage, although a prepared shield absorbs the first. Every new attempt consumes energy again.</p>
  <p>Repair: each failed check earns ${num(S.value('repairError'))}; the attempt ends after the third failed check, costing 5 protection. Mining crack: ${num(S.value('miningError'))}. Failed stabilization: ${num(S.value('pressureError'))} and −4 oxygen. A failed or aborted attempt has at least one penalty event. Management minigames consume a day; space expedition stages consume resources but not days.</p>
  <h3>Protection against repeated point farming</h3><p>The same answer choice is scored only once. A completed stage, repair, SOS, or final expedition bonus cannot be scored again until a new game starts. Each type of mining, each crop harvest, and each repeatable procedure have a maximum of ${S.config.repeatLimit} positive rewards per mission. Afterward, actions still change resources but give 0 points. Negative consequences of new attempts are retained.</p>
  <p>A random storm does not deduct points: the player’s decisions, not random events, are scored. Insufficient resources block actions without a scoring penalty.</p>`);}
 function settings(){

  dialog('Scoring Settings',`<p>Select the rules <b>before starting the game</b>. They apply to all modules. These are local training settings with no separate teacher password.</p>${locked?'<div class="learn-note">The current mission has already started. The rules are locked. Save the report, click “New Game,” then open settings before starting.</div>':''}
  <form id="score-form"><fieldset ${locked?'disabled':''}><div class="settings-row"><button type="button" id="preset-default">Training Profile</button><button type="button" id="preset-challenge">Timed Challenge Profile</button></div>
  <label>Scenario Seed <input name="seed" type="number" min="1" max="2147483647" step="1" required value="${c.seed}"></label>

  $('export-report').onclick=()=>{const blob=new Blob([JSON.stringify(S.report(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ARES7_learning_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 }

 document.addEventListener('DOMContentLoaded',()=>{
  const bar=document.createElement('nav');bar.className='learning-nav';bar.setAttribute('aria-label','Learning Materials');bar.innerHTML='<button id="learn-about">About the Game</button><button id="learn-data">Data Sources</button><button id="learn-rules">How Scoring Works</button><button id="learn-settings">Settings</button><button id="learn-journal">Decision Log</button><button id="learn-restart">New Game</button>';

  const oldFinish=window.ARESGame.finish;window.ARESGame.finish=function(...args){oldFinish.apply(this,args);if($('modal')){const b=document.createElement('button');b.textContent='Explain Result and Save Report';b.onclick=journal;$('modal').append(b);}};

<script>
/* Game component notes. */
(()=>{
 const rooms=[

<script>
/* Pure rules: no DOM, timers or station mutations. Reusable in browser and Node. */
(function(root){
 'use strict';
 const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return(x>>>0)/4294967296;};}
 function shuffle(a,random){for(let i=a.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 function mining(seed,options={}){
  const random=rng(seed),cells=shuffle([...Array(12).fill('ore'),...Array(6).fill('fault'),...Array(18).fill('rock')],random).map(kind=>({kind,open:false,scanned:false}));
  let cuts=10+clamp(options.extraCuts||0,0,2),scans=3+clamp(options.extraScans||0,0,1),ore=0,hits=0;
  const near=i=>cells.reduce((a,c,j)=>a+(c.kind==='fault'&&j!==i&&Math.abs(j%6-i%6)<=1&&Math.abs(Math.floor(j/6)-Math.floor(i/6))<=1?1:0),0);
  return {cells,near,get stats(){return{cuts,scans,ore,hits,done:cuts===0||hits===3};},scan(i){if(scans<=0||this.stats.done||cells[i].scanned)return false;scans--;cells.forEach((c,j)=>{if(Math.abs(j%6-i%6)<=1&&Math.abs(Math.floor(j/6)-Math.floor(i/6))<=1)c.scanned=true;});return true;},dig(i){const c=cells[i];if(!c||c.open||this.stats.done)return false;c.open=true;cuts--;if(c.kind==='ore')ore++;if(c.kind==='fault')hits++;return true;},result(){return{won:ore>=3&&hits<3,quality:clamp(ore/10,0,1),mistakes:hits,ore};}};
 }
 const dirs=[[-1,0],[0,1],[1,0],[0,-1]]; // N E S W
 const rotate=(mask,turns)=>((mask<<turns)|(mask>>(4-turns)))&15;
 function pipes(seed,options={}){
  const random=rng(seed),path=random()>.5?[10,11,6,7,8,13,14]:[10,11,16,17,18,13,14];
  const cells=Array.from({length:25},()=>({mask:[5,3][Math.floor(random()*2)],rotation:Math.floor(random()*4)}));
  path.forEach((i,n)=>{const prev=n?path[n-1]:i-1,next=n<path.length-1?path[n+1]:i+1;const bit=j=>j===i-5?1:j===i+1?2:j===i+5?4:8;cells[i].mask=bit(prev)|bit(next);cells[i].rotation=Math.floor(random()*4);});
  // Guarantee a puzzle, rather than an already completed circuit.
  cells[10].rotation=1;
  if(options.guided){cells.forEach(c=>c.rotation=0);cells[10].rotation=1;cells[11].rotation=1;}
  let turns=0,checks=0;
  const ports=i=>rotate(cells[i].mask,cells[i].rotation);
  function connected(){const seen=new Set();if(!(ports(10)&8))return seen;const queue=[10];seen.add(10);while(queue.length){const i=queue.shift();dirs.forEach(([dy,dx],d)=>{const row=Math.floor(i/5)+dy,col=i%5+dx,j=row*5+col;if(row<0||row>4||col<0||col>4||seen.has(j))return;if((ports(i)&(1<<d))&&(ports(j)&(1<<((d+2)%4)))){seen.add(j);queue.push(j);}});}return seen;}
  return{cells,ports,connected,get stats(){return{turns,checks};},turn(i){if(i<0||i>=25)return;cells[i].rotation=(cells[i].rotation+1)%4;turns++;},check(){checks++;return connected().has(14)&&!!(ports(14)&2);},result(won){return{won,quality:won?clamp(1-(checks-1)*.2, .4,1):0,mistakes:won?checks-1:checks};}};
 }
 function pressure(seed){const random=rng(seed),targets=[38,62,48].map(x=>x+Math.floor(random()*9)-4),valves=[15,85,25],values=[22,80,30],offsets=[0,0,0];let time=0,stable=0,critical=0,nextPulse=8;
  return{targets,valves,values,offsets,get stats(){return{time,stable,critical,done:stable>=5||time>=35||critical>=2,won:stable>=5};},set(i,value){valves[i]=clamp(Number(value),0,100);},tick(dt){if(this.stats.done)return;dt=clamp(dt,0,.1);time+=dt;if(time>=nextPulse){offsets[Math.floor(random()*3)]=(random()>.5?1:-1)*7;nextPulse+=8;}values.forEach((v,i)=>{const equilibrium=10+.8*valves[i]+offsets[i]+.08*(valves[(i+1)%3]-valves[i]);values[i]=clamp(v+(equilibrium-v)*dt*.9,0,100);});const ok=values.every((v,i)=>Math.abs(v-targets[i])<=7);stable=ok?stable+dt:0;critical=values.some(v=>v<5||v>95)?critical+dt:0;},result(){return{won:stable>=5,quality:stable>=5?clamp(1-time/70,.5,1):0,mistakes:stable>=5?0:1};}};

<script>
/* Adapter: this is the only minigame file permitted to mutate the station. */
(()=>{'use strict';
 const UI=window.ARESMinigames,Score=window.ARESScore,Game=window.ARESGame;
 let epoch=0;const state=()=>Game.getState();
 const recipes={
  mineRepair:{type:'pipes',title:'Restore Mining Drill',flag:'miningRestored',repairKey:'mine'},
  shieldRepair:{type:'pipes',title:'Restore Shield',flag:'protectionRestored',repairKey:'shield',resource:'protection',base:15,extra:15},
  hullRepair:{type:'pipes',title:'Repair Hull',resource:'protection',base:12,extra:18},
  ice:{type:'mining',title:'Ice Extraction',material:'ice'},
  regolith:{type:'mining',title:'Regolith Extraction',material:'regolith'},
  lifeRepair:{type:'pressure',title:'Start Oxygen Module',flag:'oxygenSystemRestored',repairKey:'life',resource:'oxygen',base:6,extra:6},
  oxygen:{type:'pressure',title:'Oxygen Reserve',resource:'oxygen',base:12,extra:18},
  water:{type:'pressure',title:'Water Regeneration',resource:'water',base:12,extra:16},
  filters:{type:'pressure',title:'Ventilation Balance',apply:s=>{s.filterDirt=0;}},
  condensate:{type:'pressure',title:'Condensate Collection',resource:'water',base:4,extra:5},
  eco:{type:'pressure',title:'Economy Mode',apply:s=>{s.ecoMode=true;}}
 };
 const instructions={mining:'Scan the area, then drill selected cells. Drilling and scanning limits depend on preparation. The third damage event ends the attempt. Success requires at least 3 deposits and fewer than 3 damage events. The amount of ore collected determines the reward.',pipes:'Rotate the tiles to connect the input and output in the third row. Connected tiles light up. When the path is ready, send a test pulse. Three failed tests end the attempt.',pressure:'Adjust three valves using sliders. Keep all readings in the green zones for 5 consecutive seconds. The circuits are interconnected, respond gradually, and change under load. You have 35 seconds of active time.'};

 }

   stakes:`Cost to start: ${formatCost(action.cost)||'no cost'}. Every attempt that is started costs 1 game day. ${recipe.type==='mining'?'More ore means more resources; cracks incur penalties.':recipe.type==='pipes'?'Success restores the system; failure costs 5 protection.':'Success replenishes or adjusts the system; failure costs 4 oxygen.'} Pausing is free. ${window.ARESAdventure?.consequence(action.id)||''}`,

  root.innerHTML=`<div class="ares-mission"><button id="arcade-back">← Back to Space Map</button><div class="ares-mission-header"><div class="ares-mission-icon">${m.icon}</div><div><h1>${m.name}</h1><p>${m.subtitle}</p></div></div><p>${m.description}</p><p class="learn-muted">Arcade training scenario; flight speed and obstacles are illustrative. Controls: arrow keys, A/D, or lane buttons.</p><div class="mg-mission-steps">${['Approach','Data Collection','Return'].map((name,i)=>`<span class="${p.resolved[i]?'done':''}">${p.resolved[i]?'✓':i+1} ${name}</span>`).join('')}</div><div class="mg-mission-card"><h2>${['Approach the Target','Collect Signals','Return with Data'][stage]}</h2><p>Avoid debris and collect at least 2 signals. Three collisions end the attempt. Starting a stage costs 2 energy. The game day does not change during the expedition.</p><p>${done?'Stage completed. The repeat bonus is locked.':p.arcadeFeedback?.[stage]||'Route ready. Control the craft across three lanes.'}</p><button id="arcade-flight" class="launch-flight" ${done?'disabled':''}>Launch Flight — Stage ${stage+1}</button><p id="arcade-warning" role="status"></p></div><div class="ares-mission-task"></div></div>`;
  document.getElementById('arcade-back').onclick=()=>this.returnToMap();
  if(done)this.addNext();
  document.getElementById('arcade-flight').onclick=()=>{
   if(p.resolved[stage]||UI.busy||state().gameOver)return;
   if(!can({energy:2})){document.getElementById('arcade-warning').textContent='You need 2 energy. Return to the station and charge the batteries.';return;}
   const currentEpoch=epoch,key=Score.id('flight'),base=`mission:${id}:${stage}`;
   let started=false,settled=false;
   const bonuses=window.ARESAdventure?.links('flight')||{};
   p.arcadeAttempts??={};p.arcadeFeedback??={};
   UI.launch({type:'flight',title:m.name+' · Stage '+(stage+1),stage,seed:Math.floor(Score.random()*2147483646)+1,returnLabel:'Back to Expedition Stages',instructions:'Control the craft across three lanes. Green diamonds are signals; red debris is dangerous. Reach the end and collect at least two signals. Use ← →, A/D, lane buttons, or click the play area.',stakes:`Start: −2 energy. Each collision: ${Score.value('flightError')} points and −2 protection. A corrected or repeated successful attempt awards +${Score.value('missionFixed')} instead of +${Score.value('missionCorrect')}. Replaying a completed stage does not award points. ${window.ARESAdventure?.consequence('flight')||''}`,
    onStart:()=>{if(started||epoch!==currentEpoch||state().gameOver||!state().gameStarted)return false;started=spend({energy:2});if(started)window.ARESAdventure?.consume('flight');return started;},
    onResult:result=>{if(!started||settled||epoch!==currentEpoch||state().gameOver)return 'The game has already ended.';
     settled=true;
     p.arcadeAttempts[stage]=(p.arcadeAttempts[stage]||0)+1;
     const mistakes=Math.max(result.mistakes||0,result.won?0:1);
     failure('flightError',key,'Expedition '+m.name+': collision, insufficient signals, or interruption',mistakes);
     const damage=Math.max(0,(result.hits??mistakes)-(bonuses.armor||0));
     if(damage)Score.effects('Damage during expedition',{protection:-2*damage});
     if(result.won){const clean=p.arcadeAttempts[stage]===1&&mistakes===0;Score.award(clean?'missionCorrect':'missionFixed',{key:base+':done',reason:m.name+': arcade stage '+(stage+1),section:'Expeditions'});p.resolved[stage]=true;}
     p.arcadeFeedback[stage]=result.won?`Stage complete. Signals collected: ${result.signals}.`:'Flight incomplete. Watch for a clear lane and switch before debris approaches.';
     const consequence=window.ARESAdventure?.miniResult('flight',result)||'';
     p.arcadeFeedback[stage]+=' '+consequence;
     Game.checkGameOver();Game.render();return p.arcadeFeedback[stage]+` Errors: ${mistakes}. Points and damage have been recorded in the report.`;
    },onClose:()=>{if(epoch===currentEpoch&&this.currentId===id&&!state().gameOver)this.render();}
   });
  };
 };
 const restart=Game.restart;Game.restart=function(){epoch++;UI.cancel();restart.call(this);};
 // Expose integration metadata for maintainers, without a state-mutation/debug shortcut.
 window.ARESMiniIntegration={version:1,actionIds:Object.freeze(Object.keys(recipes))};
})();

</script>
<script>
(function (root) {
  'use strict';
  const scenarios = {
    standard: {
      name: 'First Signal', tag: 'BASIC',
      description: 'All main modules are offline, but supplies are full. Restore the station and transmit an SOS.',
      start: {},
      events: [
        {day:5,text:'Dust storm: power generation drops and the hull takes damage.',storm:true,effects:{energy:-8,protection:-5}},
        {day:8,text:'The storm has ended.',storm:false,effects:{}},
        {day:9,text:'Leak in the water reservoir.',effects:{water:-12}},
        {day:10,text:'A food container has been found.',effects:{food:5}},
        {day:12,text:'Second dust storm.',storm:true,effects:{energy:-8,protection:-5}},
        {day:15,text:'The storm has passed; a power cable is damaged.',storm:false,effects:{energy:-10}}
      ]
    },
    impact: {
      name: 'After the Impact', tag: 'HULL',
      description: 'A fragment damaged the hull. Protection 45, materials 14. Power is working: prioritize airtightness.',
      start:{protection:45,health:85,energy:80,materials:14,powerRestored:true},
      events:[
        {day:4,text:'A new wave of debris is approaching the station.',effects:{protection:-12},guard:'protectionRestored',mitigated:{protection:-3}},
        {day:8,text:'Emergency repair parts depot unlocked.',effects:{materials:4}},
        {day:12,text:'Outer circuit depressurization.',effects:{oxygen:-12},guard:'protectionRestored',mitigated:{oxygen:-3}},
        {day:16,text:'Thermal stress on the hull.',effects:{protection:-10},guard:'protectionRestored',mitigated:{protection:-2}}
      ]
    },
    blackout: {
      name: 'Last Charge', tag: 'ENERGY',
      description: 'Only 45 energy remains. The oxygen module and greenhouse are running. Choose what to power and restore the power module.',
      start:{energy:45,oxygen:85,water:75,food:70,oxygenSystemRestored:true,greenhouseRestored:true},
      events:[
        {day:4,text:'Voltage drop on the main bus.',effects:{energy:-12},guard:'powerRestored',mitigated:{energy:-3}},
        {day:8,text:'Solar panels temporarily receive no sunlight.',storm:true,effects:{energy:-6}},
        {day:11,text:'The panels are receiving sunlight again.',storm:false,effects:{energy:8}},
        {day:15,text:'Backup battery overheating.',effects:{energy:-10},guard:'powerRestored',mitigated:{energy:-2}}
      ]
    },
    air: {
      name: 'Right to Breathe', tag: 'LIFE SUPPORT',
      description: 'Oxygen 48, water 55. The power module is operational. Restore the air circuit and monitor water.',
      start:{oxygen:48,water:55,energy:85,powerRestored:true,filterDirt:35},
      events:[
        {day:4,text:'Ventilation load is increasing.',effects:{oxygen:-10},guard:'oxygenSystemRestored',mitigated:{oxygen:-2}},
        {day:7,text:'A reserve of clean water has been found.',effects:{water:12}},
        {day:11,text:'Contamination in the external air circuit.',effects:{oxygen:-12},guard:'oxygenSystemRestored',mitigated:{oxygen:-3}},
        {day:16,text:'Pipeline leak.',effects:{water:-8}}
      ]
    }
  };
  const roomFlags = {power:'powerRestored',life:'oxygenSystemRestored',farm:'greenhouseRestored',mine:'miningRestored',shield:'protectionRestored',command:'radioRestored'};
  function create(id='standard',tutorial=true) {
    if (!scenarios[id]) throw Error('Unknown scenario');
    return {scenario:id,guidedStart:!!tutorial,tutorial:tutorial?0:-1,tutorialMessage:'',lastConsequence:'',farmPaused:false,salvaged:false,
      temporary:{},calibration:0,surveys:0,flightArmor:0,decisions:[],history:[],eventsSeen:[],miniHistory:[]};
  }
  function status(s,room,emergency=false) {
    const a=s.adventure;
    if(room==='emergency')return emergency?{kind:'critical',text:'! Active Emergency'}:{kind:'ready',text:'✓ On Standby'};
    if(room==='expeditions')return {kind:'ready',text:'↗ Available Routes'};
    if((room==='life'&&(s.oxygen<25||s.water<20))||(room==='power'&&s.energy<20)||(room==='shield'&&s.protection<35))return {kind:'critical',text:'! Critical Supply'};
    if(!s[roomFlags[room]])return {kind:'offline',text:'○ Requires repair'};
    if(room==='farm'&&a?.farmPaused)return {kind:'paused',text:'Ⅱ Greenhouse Paused'};
    if(a?.temporary[room])return {kind:'degraded',text:'△ Repair until Day '+a.temporary[room].expires};
    return {kind:'ready',text:'● Online'};
  }
  function links(a,id) {
    return {extraCuts:['ice','regolith'].includes(id)&&a.calibration>0?2:0,
      extraScans:['ice','regolith'].includes(id)&&a.surveys>0?1:0,
      armor:id==='flight'&&a.flightArmor>0?1:0};
  }
  function events(s) {
    return scenarios[s.adventure.scenario].events.filter(e=>e.day===s.day&&!s.adventure.eventsSeen.includes(e.day)).map(e=>({...e,effects:e.guard&&s[e.guard]?e.mitigated:e.effects,protected:!!(e.guard&&s[e.guard])}));
  }
  const api={scenarios,roomFlags,create,status,links,events};
  if(typeof module!=='undefined')module.exports=api;
  root.ARESAdventureCore=api;
})(typeof window==='undefined'?globalThis:window);

</script>
<script>
(() => {
  'use strict';
  const G=window.ARESGame,S=window.ARESScore,C=window.ARESAdventureCore;
  const state=()=>G.getState();
  let selected='standard',guided=true,decisionDialog=null;
  const labels={energy:'Energy',oxygen:'Oxygen',water:'Water',food:'Food',materials:'Materials',protection:'Hull',morale:'Morale'};
  const deltaText=effects=>Object.entries(effects).map(([k,v])=>`${labels[k]||k} ${v>0?'+':''}${v}`).join(' · ');
  const choices={
    farmPause:{room:'farm',title:'Pause Greenhouse',cost:{},effects:{},enabled:s=>s.greenhouseRestored&&!s.adventure.farmPaused,
      consequence:'While the greenhouse is paused, save up to 2 energy per turn (maximum 100) and avoid the 2-water growing cost; food decreases by 2 instead of increasing by 4. Switching costs one day.',apply:s=>s.adventure.farmPaused=true},
    farmResume:{room:'farm',title:'Resume Greenhouse',cost:{energy:2},effects:{},enabled:s=>s.greenhouseRestored&&s.adventure.farmPaused,
      consequence:'The normal +4 food and −2 water per turn resume when energy is available. The +2 energy saving ends. Switching costs one day.',apply:s=>s.adventure.farmPaused=false},
    salvage:{room:'command',title:'Dismantle Backup Airlock',cost:{},effects:{materials:5,protection:-12},enabled:s=>!s.adventure.salvaged&&s.protection>12,
      consequence:'One-time: +5 materials but −12 protection. This decision is irreversible during this session. Regular daily costs still apply.',apply:s=>s.adventure.salvaged=true},
    supplies:{room:'command',title:'Convert Food Reserves to Water',cost:{food:8,energy:2},effects:{water:12,morale:-4},enabled:s=>s.water<100,
      consequence:'Gain 12 water at the cost of 8 food, 2 energy, and 4 morale. The meter is capped at 100. Regular daily costs still apply.'},
    brace:{room:'shield',title:'Reinforce Hull with Spare Parts',cost:{materials:4,energy:3},effects:{protection:18},enabled:s=>s.protection<100,
      consequence:'Gain up to 18 protection, leaving fewer spare parts for other repairs. This reinforces the hull but does not activate an offline shield. Regular daily costs still apply.'}
  };
  function chooseScenario(id) {
    if(state().gameStarted||!C.scenarios[id])return false;
    selected=id;window.ARESStationMap?.refresh();return true;
  }
  function preview(){return state().gameStarted?state():{...state(),...C.scenarios[selected].start,adventure:C.create(selected,guided)};}
  function record() {
    const a=state().adventure;if(!a)return;
    a.history.push({day:state().day,...S.snapshot()});if(a.history.length>21)a.history.shift();
  }
  function consequence(id) {
    const a=state().adventure;if(!a)return '';
    const link=C.links(a,id);
    if(['ice','regolith'].includes(id))return `Preparation: ${10+link.extraCuts} drilling actions, ${3+link.extraScans} scans. Calibration grants +2 drilling actions; flight data grants +1 scan. The bonus is consumed only at launch.`;
    if(id==='flight')return link.armor?'A prepared shield absorbs 2 protection damage from the first collision. Collisions and points still count. One charge is consumed at launch.':'A precise shield repair prepares protection for the next flight. A successful flight grants +1 scan for the next mining run.';
    if(['mineRepair','lifeRepair','shieldRepair','hullRepair'].includes(id))return 'Quality of 80% or higher provides a reliable repair. Below 80%, the repair is temporary: the system will need repairs again after 3 day changes. The deadline appears on the map.';
    return '';
  }
  function consume(id){const a=state().adventure;if(!a)return;const l=C.links(a,id);if(l.extraCuts)a.calibration--;if(l.extraScans)a.surveys--;if(l.armor)a.flightArmor--;}
  function miniResult(id,result) {
    const s=state(),a=s.adventure;if(!a)return '';
    a.miniHistory.push({day:s.day,id,won:result.won,quality:result.quality||0});
    let message='';
    const room={mineRepair:'mine',lifeRepair:'life',shieldRepair:'shield',hullRepair:'shield'}[id];
    if(result.won&&room){
      if(result.quality>=.8){delete a.temporary[room];message='Reliable repair: no repeat failure is scheduled.';
        if(room==='mine'){a.calibration=2;message+=' The next 2 mining runs receive +2 drilling actions.';}
        if(room==='shield'){a.flightArmor=2;message+=' The next 2 flights will be protected from their first damage event.';}
      }else{a.temporary[room]={expires:s.day+3};message=`Temporary repair. Failure will recur at the start of Day ${s.day+3}. Secure it in this compartment for 3 materials and 2 energy, or repair the system again after failure.`;}
    }
    if(id==='flight'&&result.won){a.surveys=Math.min(3,a.surveys+1);message='Deposit map acquired: +1 scan in the next mining run (up to 3 maps in reserve).';}
    if(id==='mineRepair'&&result.won&&a.tutorial>=0&&a.tutorial<3){a.tutorial=3;a.tutorialMessage='You restored the drill. The cost was deducted and the station survived another day. Compare supplies with their starting values.';}
    if(message){a.lastConsequence=message;G.logEvent(message);}
    return message;
  }
  function beforeDay(){
    const s=state(),a=s.adventure;if(!a)return;
    for(const [room,repair] of Object.entries(a.temporary))if(s.day>=repair.expires){
      delete a.temporary[room];s[C.roomFlags[room]]=false;
      if(room==='shield')S.effects('Temporary Shield Failure Recurrence',{protection:-8});
      a.lastConsequence='The temporary repair has expired: '+({mine:'mining drill',life:'oxygen module',shield:'shield'}[room])+'. Restoration required.';G.logEvent(a.lastConsequence);
    }
    if(a.farmPaused&&s.greenhouseRestored)S.effects('Paused Greenhouse Savings',{energy:2});
  }
  function events(){const s=state();if(!s.adventure)return;
    for(const e of C.events(s)){s.adventure.eventsSeen.push(e.day);if(typeof e.storm==='boolean')s.stormActive=e.storm;S.effects(e.text,e.effects);G.logEvent(e.text+(e.protected?' The prepared system reduced losses.':'')+' '+deltaText(e.effects));}
    if(s.day===20)G.logEvent('Final day. The mission will end after the next management action.');
  }
  function commit(id,day){
    const s=state(),a=s.adventure,c=choices[id];
    if(!a||!c||!s.gameStarted||s.gameOver||s.day!==day||!c.enabled(s)||!can(c.cost))return false;
    if(!spend(c.cost))return false;
    S.effects(c.title,c.effects);c.apply?.(s);a.decisions.push({day,id,title:c.title,cost:{...c.cost},effects:{...c.effects},explanation:c.consequence});a.lastConsequence=c.title+'. '+c.consequence;G.logEvent(a.lastConsequence);G.nextDay();return true;
  }
  function openDecision(id){
    const s=state(),c=choices[id];if(!c||!s.gameStarted||s.gameOver||window.ARESMinigames.busy)return;
    const day=s.day;
    if(!decisionDialog){decisionDialog=document.createElement('dialog');decisionDialog.id='decision-dialog';decisionDialog.className='adventure-dialog';document.body.append(decisionDialog);}
    decisionDialog.innerHTML=`<span class="deck-eyebrow">TEAM DECISION</span><h2>${c.title}</h2><p>${c.consequence}</p><div class="decision-effects">Cost: ${formatCost(c.cost)||'no initial cost'}<br>Immediate changes: ${deltaText(c.effects)||'operating mode change'}</div><p>This decision awards no separate points. Its consequences affect survival. Confirming costs 1 day.</p><button id="decision-commit">Accept Consequences and Proceed</button><button id="decision-cancel">Return Without Changes</button><p id="decision-error" role="status"></p>`;
    document.getElementById('decision-commit').onclick=()=>{if(commit(id,day))decisionDialog.close();else document.getElementById('decision-error').textContent='The state has changed or resources are insufficient. Close the window and review supplies.';};
    document.getElementById('decision-cancel').onclick=()=>decisionDialog.close();decisionDialog.showModal();
  }
  function reinforce(room){
    const s=state(),a=s.adventure;if(!a?.temporary[room]||!s.gameStarted||s.gameOver||!can({materials:3,energy:2}))return;
    if(!spend({materials:3,energy:2}))return;
    delete a.temporary[room];a.decisions.push({day:s.day,id:'reinforce:'+room,title:'Secure Temporary Repair',cost:{materials:3,energy:2}});G.logEvent('Temporary repair secured: −3 materials, −2 energy; recurring failure cancelled.');G.nextDay();
  }
  const oldActions=G.getActions;
  G.getActions=function(){const base=oldActions.call(this),s=state();if(!s.adventure)return base;
    if(s.adventure.farmPaused&&s.currentRoom==='farm')for(const action of base)if(/Grow/i.test(action.label)){action.enabled=false;action.help='The greenhouse is paused. Resume it before growing crops.';}
    for(const [id,c]of Object.entries(choices))if(c.room===s.currentRoom)base.push({id:'decision:'+id,label:'⇄ '+c.title,cost:c.cost,enabled:c.enabled(s)&&can(c.cost),help:c.consequence,run:()=>openDecision(id)});
    if(s.adventure.temporary[s.currentRoom])base.push({id:'reinforce',label:'Secure Temporary Repair',cost:{materials:3,energy:2},enabled:can({materials:3,energy:2}),help:'Prevents repeat failure. Costs one day and spare parts; no additional points.',run:()=>reinforce(s.currentRoom)});
    return base;
  };
  function tutorialAnswer(resource){const a=state().adventure;if(!a||a.tutorial!==0)return;const fields=['energy','oxygen','water'],min=Math.min(...fields.map(k=>state()[k]));if(state()[resource]===min){a.tutorial=1;a.tutorialMessage='Correct. Equally low supplies have equal priority.';}else a.tutorialMessage='Compare the three values and choose the lowest supply. This is a tutorial; there is no penalty.';render();}
  function render(){
    const s=state(),a=s.adventure,el=document.getElementById('adventure-panel');if(!el)return;
    if(!a||!s.gameStarted||s.gameOver){el.hidden=true;return;}el.hidden=false;
    let tutorial='';
    if(a.tutorial>=0){const step=a.tutorial;
      tutorial=`<section class="tutorial-card"><span class="deck-eyebrow">GUIDED INTRODUCTION · ${Math.min(step+1,4)}/4</span><h3>${['Assess Supplies','Find the Damaged Module','Perform the First Repair','Review the Consequences'][step]}</h3><p>${a.tutorialMessage||''}</p>`;
      if(step===0)tutorial+=`<p>Which of these supplies is lowest? If values are equal, choose either one.</p>${['energy','oxygen','water'].map(k=>`<button data-tutorial-resource="${k}">${labels[k]}: ${s[k]}</button>`).join('')}`;
      if(step===1)tutorial+='<p>The map marks the drill as damaged. Open the mining compartment.</p><button id="tutorial-mine">Go to Mining →</button>';
      if(step===2)tutorial+='<p>Select “Restore Mining Module.” In the training circuit, rotate tiles 11 and 12 to connect the path, then send a test pulse. This is a real action: −2 materials, −4 energy, and 1 day.</p><button id="tutorial-mine">Go to Repair Action →</button>';
      if(step===3)tutorial+=`<p>Before: energy ${a.history[0]?.energy}, materials ${a.history[0]?.materials}. Now: energy ${s.energy}, materials ${s.materials}. Daily costs are calculated separately from repairs. The next decision is yours.</p><button id="tutorial-done">Understood. I’ll Take Control</button><button id="tutorial-map">View Live Map</button>`;
      tutorial+='<button id="tutorial-skip" class="subtle">Finish Tutorial</button></section>';
    }
    const temporary=Object.entries(a.temporary).map(([room,r])=>`${G.rooms[room].name}: until Day ${r.expires}`).join(' · ');
    el.innerHTML=`${tutorial}${a.lastConsequence?`<p class="adventure-consequence" role="status">${a.lastConsequence}</p>`:''}<div class="adventure-status"><span>${C.scenarios[a.scenario].name}</span><span>Calibration: ${a.calibration}</span><span>Deposit Maps: ${a.surveys}</span><span>Shield Charges: ${a.flightArmor}</span>${a.farmPaused?'<span>Ⅱ Greenhouse Paused</span>':''}</div>${temporary?`<p class="temporary-warning">△ Temporary Repairs: ${temporary}. Secure them in the appropriate compartment.</p>`:''}`;
    el.querySelectorAll('[data-tutorial-resource]').forEach(b=>b.onclick=()=>tutorialAnswer(b.dataset.tutorialResource));
    const bind=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn;};
    bind('tutorial-mine',()=>{if(a.tutorial===1)a.tutorial=2;G.selectRoom('mine');});
    for(const id of ['tutorial-done','tutorial-skip'])bind(id,()=>{a.tutorial=-1;G.logEvent('Tutorial completed.');render();});
    bind('tutorial-map',()=>window.ARESStationMap.open());
    window.ARESStationMap?.refresh();
  }
  const start=G.start;G.start=function(){if(!state().gameStarted&&!state().gameOver){Object.assign(state(),C.scenarios[selected].start);state().adventure=C.create(selected,guided);record();}const wasStarted=state().gameStarted;start.call(this);if(!wasStarted&&state().adventure)G.logEvent('Scenario: '+C.scenarios[state().adventure.scenario].name);};
  const restart=G.restart;G.restart=function(){decisionDialog?.close();state().adventure=null;restart.call(this);render();};
  const oldRender=G.render;G.render=function(){oldRender.call(this);render();};
  const oldSelect=G.selectRoom;G.selectRoom=function(room){if(room==='mine'&&state().adventure?.tutorial===1)state().adventure.tutorial=2;oldSelect.call(this,room);};
  const oldReason=G.actionBlockReason;G.actionBlockReason=function(action){if(action.id?.startsWith('decision:'))return 'Decision unavailable: check supplies, greenhouse status, or whether the backup airlock has already been dismantled.';if(state().adventure?.farmPaused&&/Grow/i.test(action.label))return 'The greenhouse is paused. Resume it first.';return oldReason.call(this,action);};
  const report=S.report;S.report=function(){return {...report.call(this),adventure:state().adventure?JSON.parse(JSON.stringify(state().adventure)):null};};
  window.ARESAdventure={chooseScenario,preview,events,beforeDay,record,miniResult,consume,consequence,render,commit,
    get selected(){return selected;},get guided(){return guided;},setGuided(value){if(!state().gameStarted)guided=!!value;},
    links:id=>state().adventure?C.links(state().adventure,id):{},
    guidedRepair:id=>id==='mineRepair'&&state().adventure?.tutorial===2,
    status:room=>C.status(preview(),room,window.ARESProtection?.status?.().active)};
  document.addEventListener('DOMContentLoaded',()=>{
    const panel=document.createElement('section');panel.id='adventure-panel';panel.hidden=true;
    document.querySelector('.main-screen').prepend(panel);render();
  });
})();

</script>
